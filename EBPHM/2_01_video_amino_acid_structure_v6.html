<body>
    <h1>Amino Acid Structure: Interactive Learning Module</h1>
    
    <!-- Main Content -->
    <div id="mainContent">

        <!-- Stats Panel -->
        <div id="statsPanel">

        <div id="summaryPanel">

            <div id="questionsSummary"></div>

            <!-- New analytics section (only visible to instructors) -->

            <button id="restartVideoButton">Restart Learning Video</button>

    </div>

    
    <script>
        // Authentication Constants
        const SIGN_IN_URL = 'https://xchee-01.github.io/EBPHM/1_signin.html';
        
        // Initialize variables
        let player;
        let currentQuestion = 0;
        let totalQuestions = 3;
        let studentData = {
            name: "",
            id: "",
            startTime: null,
            endTime: null,
            totalTimeSpent: 0,
            videoWatchedPercentage: 0,
            questionAttempts: [],
            correctAnswers: 0,
            totalAttempts: 0,
            pageUrl: window.location.href
        };
        
        // === ENHANCED VIDEO METRICS TRACKING SYSTEM ===
        // 1. Hidden metrics tracking object
        let videoMetrics = {
            playbackSpeeds: [],         // Array of {speed, startTime, duration}
            pauses: [],                 // Array of {timestamp, duration, videoPosition}
            rewatches: {},              // Object mapping time segments to rewatch count
            segmentsWatched: [],        // Array of {start, end} segments actually watched
            lastPosition: 0,            // Last time position for tracking
            lastTimestamp: null,        // Timestamp of last check
            currentSpeed: 1,            // Current playback speed
            pauseStartTime: null,       // When a pause began
            segmentResolution: 5,       // Track segments in 5-second intervals
            seekEvents: [],             // When user seeks/jumps in the video
            checkInterval: null,        // Interval for position checking
            lastPlayerState: -1,        // Track previous player state
            totalActualWatchTime: 0,    // Total time spent actively watching (not paused/skipped)
            timeSpentOnQuestions: 0     // Total time spent answering questions
        };

        // Add to existing studentData structure
        studentData.enhancedMetrics = videoMetrics;

        // Define the specific amino acid questions to ask at timestamps
        const questions = [
            {
                time: 60, // Show first question at 1 minute
                question: "What are the four groups typically attached to the α-carbon in an amino acid?",
                options: [
                    { text: "Amino group, carboxyl group, hydrogen, and side chain", correct: true },
                    { text: "Oxygen, nitrogen, carbon, and hydrogen", correct: false },
                    { text: "Protein, lipid, carbohydrate, and water", correct: false },
                    { text: "Enzyme, hormone, vitamin, and nucleotide", correct: false }
                ],
                attempts: 0,
                answeredCorrectly: false,
                selectedOption: null,
                timeToAnswer: 0,
                explanation: "The α-carbon is characterized by four distinct groups: amino group, carboxyl group, hydrogen, and the unique side chain (R group)."
            },
            {
                time: 120, // Show second question at 2 minutes
                question: "In the naming convention of amino acid carbons, what comes after the α-carbon?",
                options: [
                    { text: "β-carbon", correct: true },
                    { text: "γ-carbon", correct: false },
                    { text: "δ-carbon", correct: false },
                    { text: "ε-carbon", correct: false }
                ],
                attempts: 0,
                answeredCorrectly: false,
                selectedOption: null,
                timeToAnswer: 0,
                explanation: "The β-carbon is the first carbon in the side chain, directly next to the α-carbon."
            },
            {
                time: 180, // Show third question at 3 minutes
                question: "Which statement is true about amino acid configurations?",
                options: [
                    { text: "Biological systems exclusively use D-configuration", correct: false },
                    { text: "Glycine has a chiral center", correct: false },
                    { text: "Biological systems overwhelmingly favor L-configuration", correct: true },
                    { text: "All amino acids have identical spatial arrangements", correct: false }
                ],
                attempts: 0,
                answeredCorrectly: false,
                selectedOption: null,
                timeToAnswer: 0,
                explanation: "Nearly all naturally occurring proteins are composed of L-amino acids, with a specific spatial arrangement of groups."
            }
        ];
        
        // =========== AUTHENTICATION FUNCTIONS ===========
        
        // Store current URL for potential redirect back
        function storeCurrentUrl() {
            try {
                localStorage.setItem('lastVisitedUrl', window.location.href);
            } catch (error) {
                console.error('URL storage error:', error);
            }
        }
        
        // Check if user is authenticated
        function checkAuthentication() {
            const accountsData = localStorage.getItem('accounts');
            if (!accountsData) {
                redirectToSignIn();
                return false;
            }
            
            try {
                const accounts = JSON.parse(accountsData);
                if (!accounts || accounts.length === 0 || !accounts[0].username) {
                    redirectToSignIn();
                    return false;
                }
                return true;
            } catch (error) {
                console.error('Authentication check error:', error);
                redirectToSignIn();
                return false;
            }
        }
        
        // Redirect to sign-in page
        function redirectToSignIn() {
            storeCurrentUrl();
            window.location.href = SIGN_IN_URL;
        }
        
        // Get username from local storage
        function getUsername() {
            try {
                const accountsData = localStorage.getItem('accounts');
                
                if (accountsData) {
                    const accounts = JSON.parse(accountsData);
                    
                    if (accounts && accounts.length > 0 && accounts[0].username) {
                        return accounts[0].username;
                    }
                }
                
                return 'Guest_' + Math.floor(Math.random() * 10000);
            } catch (error) {
                console.error('Error getting username from accounts:', error);
                return 'Guest_' + Math.floor(Math.random() * 10000);
            }
        }
        
        // Check if user is an instructor (for showing detailed analytics)
        function isInstructor(username) {
            // List of instructor usernames (customize as needed)
            const instructors = ['instructor', 'admin', 'teacher', 'professor'];
            
            // Check if username contains any instructor keywords
            return instructors.some(instructor => 
                username.toLowerCase().includes(instructor));
        }
        
        // Convert to Singapore Time
        function getSingaporeTime() {
            const now = new Date();
            const sgTime = new Date(now.getTime() + (8 * 60 * 60 * 1000)); // UTC+8 for Singapore
            return sgTime;
        }
        
        // Format Singapore Time
        function formatSingaporeTime(date) {
            const options = {
                year: 'numeric',
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true,
                timeZone: 'Asia/Singapore'
            };
            return date.toLocaleString('en-SG', options) + " (SGT)";
        }
        
        // =========== ENHANCED TRACKING FUNCTIONS ===========
        
        // Initialize enhanced tracking
        function initEnhancedTracking() {
            // Set initial values
            videoMetrics.lastTimestamp = Date.now();
            videoMetrics.currentSpeed = player.getPlaybackRate();
            videoMetrics.playbackSpeeds.push({
                speed: videoMetrics.currentSpeed,
                startTime: videoMetrics.lastTimestamp,
                duration: 0
            });
            
            // Setup position check interval (more frequent for accuracy)
            videoMetrics.checkInterval = setInterval(trackVideoPosition, 250);
        }
        
        // Track actual video position and segments watched
        function trackVideoPosition() {
            if (!player || typeof player.getCurrentTime !== 'function') return;
            
            const currentTime = player.getCurrentTime();
            const playerState = player.getPlayerState();
            const now = Date.now();
            
            // Check if there was a significant position change (seek/skip)
            if (Math.abs(currentTime - videoMetrics.lastPosition) > 2 && videoMetrics.lastPosition > 0) {
                // Record seek event
                videoMetrics.seekEvents.push({
                    from: videoMetrics.lastPosition,
                    to: currentTime,
                    timestamp: now
                });
                
                // Check if this was a rewind (going backwards)
                if (currentTime < videoMetrics.lastPosition) {
                    // Track as a rewatch using segment resolution
                    const segmentKey = Math.floor(currentTime / videoMetrics.segmentResolution) * videoMetrics.segmentResolution;
                    videoMetrics.rewatches[segmentKey] = (videoMetrics.rewatches[segmentKey] || 0) + 1;
                }
            } 
            // For normal playback, track the segments actually watched
            else if (playerState === YT.PlayerState.PLAYING && 
                    currentTime > videoMetrics.lastPosition && 
                    currentTime - videoMetrics.lastPosition < 1) {
                
                // Add this segment to watched segments or extend the last segment
                const timeDiff = (now - videoMetrics.lastTimestamp) / 1000;
                
                // Increase actual watch time counter
                videoMetrics.totalActualWatchTime += timeDiff;
                
                if (videoMetrics.segmentsWatched.length === 0 || 
                    currentTime > videoMetrics.segmentsWatched[videoMetrics.segmentsWatched.length - 1].end + 1) {
                    // Start a new segment
                    videoMetrics.segmentsWatched.push({
                        start: videoMetrics.lastPosition,
                        end: currentTime,
                        duration: timeDiff,
                        speed: videoMetrics.currentSpeed
                    });
                } else {
                    // Extend the last segment
                    const lastSegment = videoMetrics.segmentsWatched[videoMetrics.segmentsWatched.length - 1];
                    lastSegment.end = currentTime;
                    lastSegment.duration += timeDiff;
                }
            }
            
            // Check for player state changes
            if (playerState !== videoMetrics.lastPlayerState) {
                handlePlayerStateChange(playerState, currentTime, now);
                videoMetrics.lastPlayerState = playerState;
            }
            
            // Update tracking variables
            videoMetrics.lastPosition = currentTime;
            videoMetrics.lastTimestamp = now;
        }
        
        // Handle player state changes for tracking
        function handlePlayerStateChange(newState, currentTime, timestamp) {
            // Handle pause events
            if (newState === YT.PlayerState.PAUSED) {
                videoMetrics.pauseStartTime = timestamp;
                videoMetrics.pauses.push({
                    videoPosition: currentTime,
                    startTime: timestamp,
                    duration: 0
                });
            }
            // Handle resume after pause
            else if (newState === YT.PlayerState.PLAYING && videoMetrics.pauseStartTime) {
                const lastPauseIndex = videoMetrics.pauses.length - 1;
                if (lastPauseIndex >= 0) {
                    videoMetrics.pauses[lastPauseIndex].duration = 
                        (timestamp - videoMetrics.pauses[lastPauseIndex].startTime) / 1000;
                }
                videoMetrics.pauseStartTime = null;
            }
        }
        
        // Track playback speed changes
        function trackPlaybackRateChange(event) {
            const newSpeed = player.getPlaybackRate();
            const now = Date.now();
            
            // Only process if speed actually changed
            if (newSpeed !== videoMetrics.currentSpeed) {
                // Update duration for the previous speed setting
                const lastIndex = videoMetrics.playbackSpeeds.length - 1;
                if (lastIndex >= 0) {
                    videoMetrics.playbackSpeeds[lastIndex].duration = 
                        (now - videoMetrics.playbackSpeeds[lastIndex].startTime) / 1000;
                }
                
                // Add new speed entry
                videoMetrics.playbackSpeeds.push({
                    speed: newSpeed,
                    startTime: now,
                    duration: 0
                });
                
                videoMetrics.currentSpeed = newSpeed;
            }
        }
        
        // Calculate accurate watch percentage
        function calculateActualWatchPercentage() {
            if (!player || typeof player.getDuration !== 'function') return 0;
            
            const duration = player.getDuration();
            if (duration <= 0) return 0;
            
            // Create an array to track which seconds were actually watched
            const watchedSeconds = new Array(Math.ceil(duration)).fill(false);
            
            // Mark all seconds that were watched in segments
            videoMetrics.segmentsWatched.forEach(segment => {
                for (let i = Math.floor(segment.start); i <= Math.floor(segment.end); i++) {
                    if (i < watchedSeconds.length) {
                        watchedSeconds[i] = true;
                    }
                }
            });
            
            // Count total watched seconds
            const totalWatchedSeconds = watchedSeconds.filter(watched => watched).length;
            
            // Calculate percentage (capped at 100%)
            return Math.min(100, Math.round((totalWatchedSeconds / duration) * 100));
        }
        
        // Finalize metrics before submitting data
        function finalizeMetrics() {
            // Update duration for the last speed entry
            const now = Date.now();
            const lastSpeedIndex = videoMetrics.playbackSpeeds.length - 1;
            
            if (lastSpeedIndex >= 0) {
                videoMetrics.playbackSpeeds[lastSpeedIndex].duration = 
                    (now - videoMetrics.playbackSpeeds[lastSpeedIndex].startTime) / 1000;
            }
            
            // Calculate and consolidate metrics summaries
            const metricsToReturn = {
                actualWatchPercentage: calculateActualWatchPercentage(),
                totalActualWatchTime: Math.round(videoMetrics.totalActualWatchTime),
                playbackSpeedChanges: videoMetrics.playbackSpeeds.length - 1,
                playbackSpeedData: videoMetrics.playbackSpeeds,
                pauseCount: videoMetrics.pauses.length,
                pauseData: videoMetrics.pauses,
                seekCount: videoMetrics.seekEvents.length,
                seekData: videoMetrics.seekEvents,
                rewatchCount: Object.keys(videoMetrics.rewatches).length,
                rewatchData: videoMetrics.rewatches,
                segmentData: videoMetrics.segmentsWatched,
                timeSpentOnQuestions: videoMetrics.timeSpentOnQuestions
            };
            
            // Calculate average response time
            let totalResponseTime = 0;
            let answeredQuestions = 0;
            
            studentData.questionAttempts.forEach(attempt => {
                if (attempt.timeToAnswer) {
                    totalResponseTime += attempt.timeToAnswer;
                    answeredQuestions++;
                }
            });
            
            metricsToReturn.averageResponseTime = 
                answeredQuestions > 0 ? (totalResponseTime / answeredQuestions).toFixed(2) : 0;
                
            // Calculate segments that received the most rewatch attention
            const highInterestSegments = [];
            for (const segmentKey in videoMetrics.rewatches) {
                if (videoMetrics.rewatches[segmentKey] > 1) {
                    highInterestSegments.push({
                        startTime: parseInt(segmentKey),
                        endTime: parseInt(segmentKey) + videoMetrics.segmentResolution,
                        rewatchCount: videoMetrics.rewatches[segmentKey]
                    });
                }
            }
            
            // Sort by most rewatched
            highInterestSegments.sort((a, b) => b.rewatchCount - a.rewatchCount);
            metricsToReturn.highInterestSegments = highInterestSegments.slice(0, 3); // Top 3 segments
            
            // Store in studentData
            studentData.enhancedMetrics = metricsToReturn;
            
            return metricsToReturn;
        }
        
        // This function modifies your existing data structure to be compatible with spreadsheets
        function prepareEnhancedTrackingData() {
            // Finalize the metrics first
            const metrics = finalizeMetrics();
            
            // Create flattened metrics that will work with spreadsheet columns
            const flattenedData = {
                // Original metrics (keep these)
                username: studentData.name,
                url: window.location.href,
                timestamp: formatSingaporeTime(getSingaporeTime()),
                totalQuestions: totalQuestions,
                correctAnswers: studentData.correctAnswers,
                totalAttempts: studentData.totalAttempts,
                accuracy: Math.round((studentData.correctAnswers / studentData.totalAttempts) * 100),
                videoProgress: metrics.actualWatchPercentage,
                totalTimeSpent: studentData.totalTimeSpent,
                id: studentData.id,
                
                // New flattened metrics for easy spreadsheet columns
                // Rewatch patterns
                totalRewatchCount: metrics.rewatchCount || 0,
                rewatchSegments: JSON.stringify(metrics.highInterestSegments || []),
                mostRewatchedSegment: metrics.highInterestSegments && metrics.highInterestSegments.length > 0 ? 
                    `${formatTime(metrics.highInterestSegments[0].startTime)}-${formatTime(metrics.highInterestSegments[0].endTime)}` : "None",
                mostRewatchedCount: metrics.highInterestSegments && metrics.highInterestSegments.length > 0 ? 
                    metrics.highInterestSegments[0].rewatchCount : 0,
                
                // Playback speed
                playbackSpeedChanges: metrics.playbackSpeedChanges || 0,
                averagePlaybackSpeed: calculateAveragePlaybackSpeed(metrics.playbackSpeedData || []),
                maxPlaybackSpeed: findMaxPlaybackSpeed(metrics.playbackSpeedData || []),
                timeSpentAt2xOrHigher: calculateTimeAtHighSpeed(metrics.playbackSpeedData || []),
                
                // Pause frequency
                totalPauseCount: metrics.pauseCount || 0,
                averagePauseDuration: calculateAveragePauseDuration(metrics.pauseData || []),
                longestPauseDuration: findLongestPause(metrics.pauseData || []),
                pausePositions: generatePausePositionsSummary(metrics.pauseData || []),
                
                // Additional useful metrics
                seekCount: metrics.seekCount || 0,
                totalActualWatchTime: metrics.totalActualWatchTime || 0,
                timeSpentOnQuestions: metrics.timeSpentOnQuestions || 0,
                averageResponseTime: metrics.averageResponseTime || 0,
                
                // Include question data and all enhanced metrics as JSON
                // (not all spreadsheets will use this, but we include it for completeness)
                questionData: JSON.stringify(studentData.questionAttempts || []),
                enhancedMetricsJSON: JSON.stringify(metrics)
            };
            
            return flattenedData;
        }

        // Calculate average playback speed weighted by duration
        function calculateAveragePlaybackSpeed(speedData) {
            if (!speedData || speedData.length === 0) return 1;
            
            let totalDuration = 0;
            let speedTimeProduct = 0;
            
            speedData.forEach(entry => {
                if (entry.duration) {
                    totalDuration += entry.duration;
                    speedTimeProduct += (entry.speed * entry.duration);
                }
            });
            
            return totalDuration > 0 ? 
                parseFloat((speedTimeProduct / totalDuration).toFixed(2)) : 1;
        }

        // Find the maximum playback speed used
        function findMaxPlaybackSpeed(speedData) {
            if (!speedData || speedData.length === 0) return 1;
            
            let maxSpeed = 0;
            speedData.forEach(entry => {
                if (entry.speed > maxSpeed && entry.duration > 1) { // Only count if used for more than 1 second
                    maxSpeed = entry.speed;
                }
            });
            
            return maxSpeed;
        }

        // Calculate time spent at 2x or higher speed
        function calculateTimeAtHighSpeed(speedData) {
            if (!speedData || speedData.length === 0) return 0;
            
            let timeAtHighSpeed = 0;
            
            speedData.forEach(entry => {
                if (entry.speed >= 2 && entry.duration) {
                    timeAtHighSpeed += entry.duration;
                }
            });
            
            return Math.round(timeAtHighSpeed);
        }

        // Calculate average pause duration
        function calculateAveragePauseDuration(pauseData) {
            if (!pauseData || pauseData.length === 0) return 0;
            
            let totalDuration = 0;
            let validPauses = 0;
            
            pauseData.forEach(pause => {
                if (pause.duration) {
                    totalDuration += pause.duration;
                    validPauses++;
                }
            });
            
            return validPauses > 0 ? 
                parseFloat((totalDuration / validPauses).toFixed(2)) : 0;
        }

        // Find the longest pause duration
        function findLongestPause(pauseData) {
            if (!pauseData || pauseData.length === 0) return 0;
            
            let longestDuration = 0;
            
            pauseData.forEach(pause => {
                if (pause.duration && pause.duration > longestDuration) {
                    longestDuration = pause.duration;
                }
            });
            
            return Math.round(longestDuration);
        }

        // Generate a summary of pause positions for the spreadsheet
        function generatePausePositionsSummary(pauseData) {
            if (!pauseData || pauseData.length === 0) return "None";
            
            // Group pauses into 30-second intervals
            const intervalSize = 30;
            const pausesByInterval = {};
            
            pauseData.forEach(pause => {
                if (typeof pause.videoPosition === 'number') {
                    const interval = Math.floor(pause.videoPosition / intervalSize) * intervalSize;
                    pausesByInterval[interval] = (pausesByInterval[interval] || 0) + 1;
                }
            });
            
            // Get the top 3 intervals with most pauses
            const sortedIntervals = Object.keys(pausesByInterval)
                .sort((a, b) => pausesByInterval[b] - pausesByInterval[a])
                .slice(0, 3);
            
            // Format as a string
            return sortedIntervals.map(interval => 
                `${formatTime(interval)}-${formatTime(parseInt(interval) + intervalSize)}: ${pausesByInterval[interval]}`
            ).join("; ");
        }
        
        // =========== TRACKING FUNCTIONS ===========
        
        // Submit tracking data to Google Sheets
        function submitVideoTrackData() {
            // Use the new function to prepare data
            const data = prepareEnhancedTrackingData();
            
            // Google Apps Script URL for video tracking data (your existing URL)
            const scriptUrl = 'https://script.google.com/macros/s/AKfycbw26ahkpl-X7Ee32wEByz5s9yN4t9JM04PvQiULKmuPBKymDrklP7pP8BXJsv3oHhag/exec';
            
            // Send data to Google Apps Script
            fetch(scriptUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
                mode: 'no-cors'
            })
            .then(() => {
                console.log('Enhanced video tracking data submitted successfully');
            })
            .catch(error => {
                console.error('Error submitting video tracking data:', error);
            });
        }
        
        // Log page visit
        function logPageVisit() {
            const username = getUsername();
            const sgTime = getSingaporeTime();
            
            // Prepare visit tracking data
            const visitData = {
                username: username,
                accessTime: formatSingaporeTime(sgTime),
                url: window.location.href,
                userAgent: navigator.userAgent
            };
            
            // Page tracking script URL
            const pageTrackUrl = 'https://script.google.com/macros/s/AKfycbxh99ycPO8R0GZYlFaznQqsF2bilaKkjuQvh1OuKa7owmc7TODLwEQAstoNADw5x4eL/exec';
            
            // Send page tracking data
            fetch(pageTrackUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(visitData),
                mode: 'no-cors'
            })
            .then(() => {
                console.log('Page visit logged successfully');
            })
            .catch(error => {
                console.error('Error logging page visit:', error);
            });
        }
        
        // Initialize student data with session ID
        function initializeStudentData() {
            // Generate a random session ID for tracking
            const sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
            
            studentData.id = sessionId;
            studentData.name = getUsername();
            studentData.startTime = getSingaporeTime();
            studentData.pageUrl = window.location.href;
            
            console.log("Session started with ID:", sessionId);
        }
        
        // =========== INITIALIZATION FUNCTION ===========
        
        // Main initialization function
        function init() {
            // Store current URL for potential redirect back
            storeCurrentUrl();
            
            // Log this page visit
            logPageVisit();
            
            // Check if user is authenticated
            if (!checkAuthentication()) {
                return; // Stop further execution if redirecting
            }
            
            // If authenticated, initialize session data
            initializeStudentData();
            
            // Load YouTube API
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            
            // Check if user is an instructor to show detailed analytics
            if (isInstructor(getUsername())) {
                document.getElementById('detailedAnalytics').style.display = 'block';
            }
        }
        
        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // =========== YOUTUBE PLAYER FUNCTIONS ===========
        
        // Create YouTube player with enhanced tracking
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '480',
                width: '100%',
                videoId: 'Z3QhmXIMfg0', // <-----------Your video ID
                playerVars: {
                    'playsinline': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'controls': 1
                },
                events: {
                    'onReady': enhancedPlayerReady,
                    'onStateChange': enhancedPlayerStateChange,
                    'onPlaybackRateChange': trackPlaybackRateChange
                }
            });
        }
        
        // When player is ready with enhanced tracking
        function enhancedPlayerReady(event) {
            console.log("Player is ready");
            updateProgressBar(0);
            
            // Initialize enhanced tracking
            initEnhancedTracking();
            
            // Update progress more frequently using the accurate method
            setInterval(updateAccurateProgress, 1000);
        }
        
        // Enhanced player state change handler
        function enhancedPlayerStateChange(event) {
            // For timestamps to show questions while the video is playing
            if (event.data == YT.PlayerState.PLAYING) {
                checkTime();
            } else if (event.data == YT.PlayerState.ENDED) {
                // Video ended, show summary
                showSummary();
            }
            
            // Additional tracking handled by trackVideoPosition
        }
        
        // Update progress with accurate calculation
        function updateAccurateProgress() {
            if (!player || typeof player.getCurrentTime !== 'function') return;
            
            // Calculate accurate percentage
            const accuratePercentage = calculateActualWatchPercentage();
            
            // Update student data
            studentData.videoWatchedPercentage = accuratePercentage;
            
            // Update UI
            document.getElementById("videoProgress").textContent = accuratePercentage + "%";
            
            // Update progress bar
            updateProgressBar(
                Math.min(
                    accuratePercentage, 
                    (askedQuestions.length / totalQuestions) * 100
                )
            );
        }
        
        // Track which questions have been asked
        let askedQuestions = [];
        
        // Check if we need to pause for a question
        function checkTime() {
            const currentTime = Math.floor(player.getCurrentTime());
            
            // Check if we should show a question
            for (let i = 0; i < questions.length; i++) {
                // Only show questions that haven't been asked yet
                if (questions[i].time <= currentTime && !askedQuestions.includes(i)) {
                    player.pauseVideo();
                    askedQuestions.push(i); // Mark this question as asked
                    showQuestion(i);
                    return;
                }
            }
            
            // Continue checking time if no question is shown
            setTimeout(checkTime, 1000);
        }
        
        // =========== QUESTION HANDLING FUNCTIONS ===========
        
        // Display a question with enhanced timing
        function showQuestion(index) {
            currentQuestion = index;
            const questionData = questions[index];
            
            // Set question text
            document.getElementById("questionText").textContent = questionData.question;
            
            // Clear previous options
            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            
            // Add options
            questionData.options.forEach((option, i) => {
                const optionElement = document.createElement("div");
                optionElement.className = "option";
                optionElement.textContent = option.text;
                optionElement.onclick = function() { checkAnswer(i); };
                optionsContainer.appendChild(optionElement);
            });
            
            // Reset feedback and continue button
            document.getElementById("feedback").textContent = "";
            document.getElementById("feedback").style.backgroundColor = "transparent";
            document.getElementById("continueButton").style.display = "none";
            
            // Use high-resolution timer for accurate response time measurement
            questionData.startTime = performance.now();
            
            // Show question container with animation
            const questionContainer = document.getElementById("questionContainer");
            questionContainer.style.display = "block";
            setTimeout(() => {
                questionContainer.style.opacity = "1";
                questionContainer.style.transform = "translateY(0)";
            }, 10);
        }
        
        // Check the selected answer with enhanced timing
        function checkAnswer(selectedIndex) {
            const questionData = questions[currentQuestion];
            const isCorrect = questionData.options[selectedIndex].correct;
            
            // Calculate precise response time in milliseconds and convert to seconds
            if (!questionData.timeToAnswer) {
                questionData.timeToAnswer = (performance.now() - questionData.startTime) / 1000;
                // Add to total time spent on questions
                videoMetrics.timeSpentOnQuestions += questionData.timeToAnswer;
            }
            
            // Increment attempts and track answer
            questionData.attempts++;
            studentData.totalAttempts++;
            
            // Store selected option
            questionData.selectedOption = selectedIndex;
            
            // Disable all option clicks after answer is selected
            const optionElements = document.querySelectorAll('.option');
            optionElements.forEach(element => {
                element.style.pointerEvents = 'none';
                element.style.opacity = '0.7';
            });
            
            // Show feedback
            const feedbackElement = document.getElementById("feedback");
            if (isCorrect) {
                feedbackElement.textContent = "Correct! Well done!";
                feedbackElement.style.color = "white";
                feedbackElement.style.backgroundColor = "#4CAF50";
                
                // Highlight correct answer
                optionElements[selectedIndex].style.backgroundColor = "#DFF2BF";
                optionElements[selectedIndex].style.borderLeft = "4px solid #4CAF50";
                optionElements[selectedIndex].style.opacity = "1";
                
                // Add explanation
                const explanation = document.createElement("div");
                explanation.className = "explanation";
                explanation.textContent = questionData.explanation;
                feedbackElement.appendChild(explanation);
                
                // Show continue button immediately
                document.getElementById("continueButton").style.display = "block";
                
                // Update progress and tracking
                updateProgressBar(askedQuestions.length / totalQuestions * 100);
                questionData.answeredCorrectly = true;
                
                // Update student stats
                studentData.correctAnswers++;
                document.getElementById("correctAnswers").textContent = studentData.correctAnswers;
                
                // Track student data with enhanced response time
                studentData.questionAttempts.push({
                    questionIndex: currentQuestion,
                    question: questionData.question,
                    attemptsNeeded: questionData.attempts,
                    answeredCorrectly: true,
                    selectedAnswer: questionData.options[selectedIndex].text,
                    correctAnswer: getCorrectAnswer(questionData),
                    timeToAnswer: questionData.timeToAnswer.toFixed(2) // Format to 2 decimal places
                });
                
                // Update accuracy
                updateAccuracy();
            } else {
                feedbackElement.textContent = "Incorrect. Try again.";
                feedbackElement.style.color = "white";
                feedbackElement.style.backgroundColor = "#F44336";
                
                // Highlight incorrect answer in red
                optionElements[selectedIndex].style.backgroundColor = "#FFBABA";
                optionElements[selectedIndex].style.borderLeft = "4px solid #F44336";
                
                // Track incorrect answer in student data
                if (questionData.attempts >= 2) {
                    // After second wrong attempt, show correct answer and continue
                    feedbackElement.textContent = "The correct answer is: " + getCorrectAnswer(questionData);
                    
                    // Add explanation
                    const explanation = document.createElement("div");
                    explanation.className = "explanation";
                    explanation.textContent = questionData.explanation;
                    feedbackElement.appendChild(explanation);
                    
                    // Track student data for incorrect final answer
                    studentData.questionAttempts.push({
                        questionIndex: currentQuestion,
                        question: questionData.question,
                        attemptsNeeded: questionData.attempts,
                        answeredCorrectly: false,
                        selectedAnswer: questionData.options[selectedIndex].text,
                        correctAnswer: getCorrectAnswer(questionData),
                        timeToAnswer: questionData.timeToAnswer.toFixed(2) // Format to 2 decimal places
                    });
                    
                    // Update accuracy
                    updateAccuracy();
                    
                    // Show continue button after 2 seconds
                    setTimeout(() => {
                        document.getElementById("continueButton").style.display = "block";
                    }, 2000);
                } else {
                    // Re-enable options for another try
                    setTimeout(() => {
                        optionElements.forEach(element => {
                            element.style.pointerEvents = 'auto';
                            element.style.opacity = '1';
                        });
                        optionElements[selectedIndex].style.opacity = '0.7'; // Keep the wrong answer faded
                    }, 800);
                }
            }
        }
        
        // Get the correct answer text for a question
        function getCorrectAnswer(questionData) {
            for (let i = 0; i < questionData.options.length; i++) {
                if (questionData.options[i].correct) {
                    return questionData.options[i].text;
                }
            }
            return "";
        }
        
        // Update accuracy statistic
        function updateAccuracy() {
            const accuracy = Math.round((studentData.correctAnswers / studentData.totalAttempts) * 100);
            document.getElementById("accuracy").textContent = accuracy + "%";
        }
        
        // =========== BUTTON HANDLERS ===========
        
        // Set up event listener for the continue button
        document.getElementById("continueButton").addEventListener("click", function() {
            // Hide question container
            const questionContainer = document.getElementById("questionContainer");
            questionContainer.style.opacity = "0";
            questionContainer.style.transform = "translateY(10px)";
            
            setTimeout(() => {
                questionContainer.style.display = "none";
                
                // Reset the options for next time
                const optionElements = document.querySelectorAll('.option');
                optionElements.forEach(element => {
                    element.style.pointerEvents = 'auto';
                    element.style.opacity = '1';
                    element.style.backgroundColor = 'var(--nus-light-grey)';
                    element.style.borderLeft = '4px solid var(--nus-blue)';
                });
                
                // Reset feedback
                document.getElementById("feedback").style.backgroundColor = "transparent";
                document.getElementById("feedback").innerHTML = "";
                
                // Check if this was the last question
                if (askedQuestions.length === totalQuestions) {
                    // All questions answered, show summary
                    showSummary();
                } else {
                    // Resume video
                    player.playVideo();
                    
                    // Start checking time again
                    setTimeout(checkTime, 1000);
                }
            }, 300);
        });
        
        // Restart Video button event listener
        document.getElementById("restartVideoButton").addEventListener("click", function() {
            // Reset student data for a new session
            const oldId = studentData.id;
            studentData = {
                name: getUsername(),
                id: oldId + "_retry",      // Add retry suffix to session ID
                startTime: getSingaporeTime(),
                endTime: null,
                totalTimeSpent: 0,
                videoWatchedPercentage: 0,
                questionAttempts: [],
                correctAnswers: 0,
                totalAttempts: 0,
                pageUrl: window.location.href
            };
            
            // Reset video metrics
            videoMetrics = {
                playbackSpeeds: [],
                pauses: [],
                rewatches: {},
                segmentsWatched: [],
                lastPosition: 0,
                lastTimestamp: null,
                currentSpeed: 1,
                pauseStartTime: null,
                segmentResolution: 5,
                seekEvents: [],
                checkInterval: null,
                lastPlayerState: -1,
                totalActualWatchTime: 0,
                timeSpentOnQuestions: 0
            };
            
            // Add metrics to student data
            studentData.enhancedMetrics = videoMetrics;
            
            // Reset questions data
            questions.forEach(q => {
                q.attempts = 0;
                q.answeredCorrectly = false;
                q.selectedOption = null;
                q.timeToAnswer = 0;
            });
            
            // Reset UI elements
            document.getElementById("correctAnswers").textContent = "0";
            document.getElementById("accuracy").textContent = "0%";
            document.getElementById("videoProgress").textContent = "0%";
            
            // Reset askedQuestions array
            askedQuestions = [];
            
            // Hide summary panel and show video container
            document.getElementById("summaryPanel").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            
            // Reset progress bar
            updateProgressBar(0);
            
            // Clear any existing interval
            if (videoMetrics.checkInterval) {
                clearInterval(videoMetrics.checkInterval);
            }
            
            // Reinitialize enhanced tracking
            initEnhancedTracking();
            
            // Restart video from beginning
            player.seekTo(0);
            player.playVideo();
            
            // Start checking time again
            setTimeout(checkTime, 1000);
        });
        
        // =========== UTILITY FUNCTIONS ===========
        
        // Generate detailed analytics HTML for instructors
        function generateDetailedAnalytics(metrics) {
            const analytics = document.getElementById('analyticsContent');
            
            // Create main analytics grid
            const gridDiv = document.createElement('div');
            gridDiv.className = 'analytics-grid';
            
            // Add metrics items
            const metricItems = [
                { label: 'Actual Watch Time', value: formatTime(metrics.totalActualWatchTime) },
                { label: 'Pause Count', value: metrics.pauseCount },
                { label: 'Seek Events', value: metrics.seekCount },
                { label: 'Avg. Response Time', value: `${metrics.averageResponseTime}s` },
                { label: 'Speed Changes', value: metrics.playbackSpeedChanges },
                { label: 'Question Time', value: formatTime(metrics.timeSpentOnQuestions) }
            ];
            
            metricItems.forEach(item => {
                const metricDiv = document.createElement('div');
                metricDiv.className = 'analytics-item';
                metricDiv.innerHTML = `<strong>${item.label}:</strong> ${item.value}`;
                gridDiv.appendChild(metricDiv);
            });
            
            analytics.appendChild(gridDiv);
            
            // Add rewatched segments section if available
            if (metrics.highInterestSegments && metrics.highInterestSegments.length > 0) {
                const rewatchTitle = document.createElement('div');
                rewatchTitle.className = 'analytics-title';
                rewatchTitle.textContent = 'High Interest Segments';
                rewatchTitle.style.marginTop = '15px';
                analytics.appendChild(rewatchTitle);
                
                const rewatchList = document.createElement('ul');
                
                metrics.highInterestSegments.forEach(segment => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `Time ${formatTime(segment.startTime)} - ${formatTime(segment.endTime)}: 
                                        rewatched <strong>${segment.rewatchCount}</strong> times`;
                    rewatchList.appendChild(listItem);
                });
                
                analytics.appendChild(rewatchList);
            }
        }
        
        // Show summary at the end with enhanced metrics
        function showSummary() {
            // Calculate end time and total time spent
            studentData.endTime = getSingaporeTime();
            studentData.totalTimeSpent = Math.floor((studentData.endTime - studentData.startTime) / 1000); // in seconds
            
            // Clear interval for position tracking
            if (videoMetrics.checkInterval) {
                clearInterval(videoMetrics.checkInterval);
            }
            
            // Finalize and organize all metrics
            const enhancedMetrics = finalizeMetrics();
            
            // Hide video container
            document.getElementById("videoContainer").style.display = "none";
            
            // Generate summary content
            const summaryContainer = document.getElementById("questionsSummary");
            summaryContainer.innerHTML = "";
            
            // Add each question to the summary
            questions.forEach((q, index) => {
                const questionDiv = document.createElement("div");
                questionDiv.className = "question-summary";
                
                const questionTitle = document.createElement("h3");
                questionTitle.textContent = `Question ${index + 1}: ${q.question}`;
                questionDiv.appendChild(questionTitle);
                
                const attemptsInfo = document.createElement("p");
                attemptsInfo.textContent = `Attempts: ${q.attempts}`;
                questionDiv.appendChild(attemptsInfo);
                
                // Add response time if available
                if (q.timeToAnswer) {
                    const responseTimeInfo = document.createElement("p");
                    responseTimeInfo.textContent = `Response Time: ${q.timeToAnswer.toFixed(1)} seconds`;
                    questionDiv.appendChild(responseTimeInfo);
                }
                
                const answerInfo = document.createElement("p");
                const studentAttempt = studentData.questionAttempts.find(a => a.questionIndex === index);
                
                if (studentAttempt && studentAttempt.answeredCorrectly) {
                    answerInfo.innerHTML = `Your answer: <span class="summary-correct">${studentAttempt.selectedAnswer}</span>`;
                } else if (studentAttempt) {
                    answerInfo.innerHTML = `Your answer: <span class="summary-incorrect">${studentAttempt.selectedAnswer}</span>`;
                    const correctAnswer = document.createElement("p");
                    correctAnswer.innerHTML = `Correct answer: <span class="summary-correct">${getCorrectAnswer(q)}</span>`;
                    questionDiv.appendChild(correctAnswer);
                } else {
                    answerInfo.textContent = "Question not attempted";
                }
                
                questionDiv.appendChild(answerInfo);
                
                // Add explanation for each question
                const explanationDiv = document.createElement("div");
                explanationDiv.className = "explanation";
                explanationDiv.textContent = q.explanation;
                questionDiv.appendChild(explanationDiv);
                
                summaryContainer.appendChild(questionDiv);
            });
            
            // Calculate overall score
            const overallScoreDiv = document.getElementById("overallScore");
            const scorePercentage = Math.round((studentData.correctAnswers / totalQuestions) * 100);
            
            // Enhanced score display with accurate metrics
            overallScoreDiv.innerHTML = `
                <h3>Overall Performance</h3>
                <p>Score: ${studentData.correctAnswers} out of ${totalQuestions} (${scorePercentage}%)</p>
                <p>Total Time Spent: ${formatTime(studentData.totalTimeSpent)}</p>
                <p>Video Watched: ${enhancedMetrics.actualWatchPercentage}%</p>
                <p>Average Response Time: ${enhancedMetrics.averageResponseTime} seconds</p>
            `;
            
            // Generate detailed analytics for instructors
            if (isInstructor(getUsername())) {
                generateDetailedAnalytics(enhancedMetrics);
                document.getElementById('detailedAnalytics').style.display = 'block';
            }
            
            // Log student data and submit to tracking
            console.log("Enhanced Student Data for Tracking:", studentData);
            submitVideoTrackData();
            
            // Show the summary panel
            document.getElementById("summaryPanel").style.display = "block";
        }
        
        // Format time in seconds to MM:SS format
        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = Math.floor(totalSeconds % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }
        
        // Update progress bar
        function updateProgressBar(percentage) {
            document.getElementById("progressBar").style.width = percentage + "%";
        }
    </script>
