<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amino Acid Structure: Interactive Learning Module</title>
    <style>
        :root {
            /* NUS Color Palette */
            --nus-blue: #003D7C;
            --nus-orange: #EF7C00;
            --nus-light-blue: #7BAFD4;
            --nus-light-orange: #F5A623;
            --nus-grey: #4A4A4A;
            --nus-light-grey: #F2F2F2;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 850px;
            margin: 0 auto;
            padding: 25px;
            background-color: #FAFAFA;
            color: var(--nus-grey);
            line-height: 1.6;
        }
        
        h1 {
            color: var(--nus-blue);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            border-bottom: 3px solid var(--nus-orange);
            padding-bottom: 15px;
        }
        
        #videoContainer {
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        
        #player {
            width: 100%;
        }
        
        #questionContainer {
            display: none;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid var(--nus-orange);
            transition: all 0.3s ease;
        }
        
        #questionText {
            color: var(--nus-blue);
            margin-top: 0;
            font-size: 1.4rem;
        }
        
        .option {
            margin: 15px 0;
            padding: 15px;
            background-color: var(--nus-light-grey);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid var(--nus-light-blue);
        }
        
        .option:hover {
            background-color: #E8E8E8;
            transform: translateX(5px);
        }
        
        #feedback {
            margin-top: 20px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        
        #continueButton {
            display: none;
            margin: 20px auto 0;
            padding: 12px 30px;
            background-color: var(--nus-blue);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }
        
        #continueButton:hover {
            background-color: #00326A;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
        }
        
        #restartVideoButton {
            display: block;
            margin: 20px auto 0;
            padding: 12px 30px;
            background-color: var(--nus-blue);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }
        
        #restartVideoButton:hover {
            background-color: #00326A;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
        }
        
        .progress-container {
            width: 100%;
            background-color: var(--nus-light-grey);
            height: 8px;
            border-radius: 4px;
            margin: 30px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0;
            background-color: var(--nus-orange);
            transition: width 0.3s ease;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
        }
        
        #mainContent {
            display: block;
        }
        
        #statsPanel {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid var(--nus-light-blue);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-card {
            background-color: var(--nus-light-grey);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--nus-blue);
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: var(--nus-grey);
        }
        
        #summaryPanel {
            display: none;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid var(--nus-orange);
        }
        
        .question-summary {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .question-summary h3 {
            color: var(--nus-blue);
            margin-bottom: 10px;
        }
        
        .summary-correct {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .summary-incorrect {
            color: #F44336;
            font-weight: bold;
        }
        
        .explanation {
            background-color: #f9f9f9;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            border-left: 3px solid var(--nus-light-blue);
        }
    </style>
</head>
<body>
    <h1>Amino Acid Structure: Interactive Learning Module</h1>
    
    <!-- Main Content -->
    <div id="mainContent">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div id="videoContainer">
            <!-- YouTube video will be embedded here -->
            <div id="player"></div>
        </div>
        
        <div id="questionContainer">
            <h2 id="questionText">Question goes here</h2>
            <div id="options"></div>
            <div id="feedback"></div>
            <button id="continueButton">Continue Video</button>
        </div>
        
        <!-- Stats Panel -->
        <div id="statsPanel">
            <h2>Your Progress</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="correctAnswers">0</div>
                    <div class="stat-label">Correct Answers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalAttempts">0</div>
                    <div class="stat-label">Total Attempts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="accuracy">0%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="videoProgress">0%</div>
                    <div class="stat-label">Video Progress</div>
                </div>
            </div>
        </div>
        
        <!-- Summary Panel (shown at the end) -->
        <div id="summaryPanel">
            <h2>Learning Module Summary</h2>
            <div id="questionsSummary"></div>
            <div id="overallScore"></div>
            <button id="restartVideoButton">Restart Learning Video</button>
        </div>
    </div>

    
    <script>
        // Authentication Constants
        const SIGN_IN_URL = 'https://xchee-01.github.io/EBPHM/1_signin.html';
        
        // Initialize variables
        let player;
        let currentQuestion = 0;
        let totalQuestions = 3;
        let studentData = {
            name: "",
            id: "",
            startTime: null,
            endTime: null,
            totalTimeSpent: 0,
            videoWatchedPercentage: 0,
            questionAttempts: [],
            correctAnswers: 0,
            totalAttempts: 0,
            pageUrl: window.location.href
        };

        // Define the specific amino acid questions to ask at timestamps
        const questions = [
            {
                time: 60, // Show first question at 1 minute
                question: "What are the four groups typically attached to the α-carbon in an amino acid?",
                options: [
                    { text: "Amino group, carboxyl group, hydrogen, and side chain", correct: true },
                    { text: "Oxygen, nitrogen, carbon, and hydrogen", correct: false },
                    { text: "Protein, lipid, carbohydrate, and water", correct: false },
                    { text: "Enzyme, hormone, vitamin, and nucleotide", correct: false }
                ],
                attempts: 0,
                answeredCorrectly: false,
                selectedOption: null,
                timeToAnswer: 0,
                explanation: "The α-carbon is characterized by four distinct groups: amino group, carboxyl group, hydrogen, and the unique side chain (R group)."
            },
            {
                time: 120, // Show second question at 2 minutes
                question: "In the naming convention of amino acid carbons, what comes after the α-carbon?",
                options: [
                    { text: "β-carbon", correct: true },
                    { text: "γ-carbon", correct: false },
                    { text: "δ-carbon", correct: false },
                    { text: "ε-carbon", correct: false }
                ],
                attempts: 0,
                answeredCorrectly: false,
                selectedOption: null,
                timeToAnswer: 0,
                explanation: "The β-carbon is the first carbon in the side chain, directly next to the α-carbon."
            },
            {
                time: 180, // Show third question at 3 minutes
                question: "Which statement is true about amino acid configurations?",
                options: [
                    { text: "Biological systems exclusively use D-configuration", correct: false },
                    { text: "Glycine has a chiral center", correct: false },
                    { text: "Biological systems overwhelmingly favor L-configuration", correct: true },
                    { text: "All amino acids have identical spatial arrangements", correct: false }
                ],
                attempts: 0,
                answeredCorrectly: false,
                selectedOption: null,
                timeToAnswer: 0,
                explanation: "Nearly all naturally occurring proteins are composed of L-amino acids, with a specific spatial arrangement of groups."
            }
        ];
        
        // =========== AUTHENTICATION FUNCTIONS ===========
        
        // Store current URL for potential redirect back
        function storeCurrentUrl() {
            try {
                localStorage.setItem('lastVisitedUrl', window.location.href);
            } catch (error) {
                console.error('URL storage error:', error);
            }
        }
        
        // Check if user is authenticated
        function checkAuthentication() {
            const accountsData = localStorage.getItem('accounts');
            if (!accountsData) {
                redirectToSignIn();
                return false;
            }
            
            try {
                const accounts = JSON.parse(accountsData);
                if (!accounts || accounts.length === 0 || !accounts[0].username) {
                    redirectToSignIn();
                    return false;
                }
                return true;
            } catch (error) {
                console.error('Authentication check error:', error);
                redirectToSignIn();
                return false;
            }
        }
        
        // Redirect to sign-in page
        function redirectToSignIn() {
            storeCurrentUrl();
            window.location.href = SIGN_IN_URL;
        }
        
        // Get username from local storage
        function getUsername() {
            try {
                const accountsData = localStorage.getItem('accounts');
                
                if (accountsData) {
                    const accounts = JSON.parse(accountsData);
                    
                    if (accounts && accounts.length > 0 && accounts[0].username) {
                        return accounts[0].username;
                    }
                }
                
                return 'Guest_' + Math.floor(Math.random() * 10000);
            } catch (error) {
                console.error('Error getting username from accounts:', error);
                return 'Guest_' + Math.floor(Math.random() * 10000);
            }
        }
        
        // =========== TRACKING FUNCTIONS ===========
        
        // Submit tracking data to Google Sheets
        function submitVideoTrackData() {
            const username = getUsername();
            
            // Prepare data for submission
            const data = {
                username: username,
                url: window.location.href,
                timestamp: new Date().toISOString(),
                totalQuestions: totalQuestions,
                correctAnswers: studentData.correctAnswers,
                totalAttempts: studentData.totalAttempts,
                accuracy: Math.round((studentData.correctAnswers / studentData.totalAttempts) * 100),
                videoProgress: studentData.videoWatchedPercentage,
                totalTimeSpent: studentData.totalTimeSpent,
                questionData: studentData.questionAttempts,
                id: studentData.id,
                pageUrl: window.location.href
            };
            
            // Google Apps Script URL for video tracking data
            const scriptUrl = 'https://script.google.com/macros/s/AKfycbw26ahkpl-X7Ee32wEByz5s9yN4t9JM04PvQiULKmuPBKymDrklP7pP8BXJsv3oHhag/exec';
            
            // Send data to Google Apps Script
            fetch(scriptUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
                mode: 'no-cors'
            })
            .then(() => {
                console.log('Video tracking data submitted successfully');
            })
            .catch(error => {
                console.error('Error submitting video tracking data:', error);
            });
        }
        
        // Log page visit
        function logPageVisit() {
            const username = getUsername();
            
            // Prepare visit tracking data
            const visitData = {
                username: username,
                accessTime: new Date().toLocaleString(),
                url: window.location.href,
                userAgent: navigator.userAgent
            };
            
            // Page tracking script URL
            const pageTrackUrl = 'https://script.google.com/macros/s/AKfycbxh99ycPO8R0GZYlFaznQqsF2bilaKkjuQvh1OuKa7owmc7TODLwEQAstoNADw5x4eL/exec';
            
            // Send page tracking data
            fetch(pageTrackUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(visitData),
                mode: 'no-cors'
            })
            .then(() => {
                console.log('Page visit logged successfully');
            })
            .catch(error => {
                console.error('Error logging page visit:', error);
            });
        }
        
        // Initialize student data with session ID
        function initializeStudentData() {
            // Generate a random session ID for tracking
            const sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
            
            studentData.id = sessionId;
            studentData.name = getUsername();
            studentData.startTime = new Date();
            studentData.pageUrl = window.location.href;
            
            console.log("Session started with ID:", sessionId);
        }
        
        // =========== INITIALIZATION FUNCTION ===========
        
        // Main initialization function
        function init() {
            // Store current URL for potential redirect back
            storeCurrentUrl();
            
            // Log this page visit
            logPageVisit();
            
            // Check if user is authenticated
            if (!checkAuthentication()) {
                return; // Stop further execution if redirecting
            }
            
            // If authenticated, initialize session data
            initializeStudentData();
            
            // Load YouTube API
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }
        
        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // =========== YOUTUBE PLAYER FUNCTIONS ===========
        
        // Create YouTube player
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '480',
                width: '100%',
                videoId: 'Z3QhmXIMfg0', // <-----------Your  video ID
                playerVars: {
                    'playsinline': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'controls': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }
        
        // When player is ready
        function onPlayerReady(event) {
            console.log("Player is ready");
            updateProgressBar(0);
            // Track video duration for percentage calculations
            setInterval(updateVideoProgress, 1000);
        }
        
        // Track video progress percentage
        function updateVideoProgress() {
            if (player && player.getDuration) {
                const currentTime = player.getCurrentTime();
                const duration = player.getDuration();
                const percentage = Math.floor((currentTime / duration) * 100);
                studentData.videoWatchedPercentage = percentage;
                document.getElementById("videoProgress").textContent = percentage + "%";
            }
        }
        
        // Check for timestamps to show questions
        function onPlayerStateChange(event) {
            // Check current time every second while the video is playing
            if (event.data == YT.PlayerState.PLAYING) {
                checkTime();
            } else if (event.data == YT.PlayerState.ENDED) {
                // Video ended, show summary
                showSummary();
            }
        }
        
        // Track which questions have been asked
        let askedQuestions = [];
        
        // Check if we need to pause for a question
        function checkTime() {
            const currentTime = Math.floor(player.getCurrentTime());
            
            // Update progress bar based on which questions have been answered
            updateProgressBar(askedQuestions.length / totalQuestions * 100);
            
            // Check if we should show a question
            for (let i = 0; i < questions.length; i++) {
                // Only show questions that haven't been asked yet
                if (questions[i].time <= currentTime && !askedQuestions.includes(i)) {
                    player.pauseVideo();
                    askedQuestions.push(i); // Mark this question as asked
                    showQuestion(i);
                    
                    // Start timing for this question
                    questions[i].startTime = new Date();
                    return;
                }
            }
            
            // Continue checking time if no question is shown
            setTimeout(checkTime, 1000);
        }
        
        // =========== QUESTION HANDLING FUNCTIONS ===========
        
        // Display a question
        function showQuestion(index) {
            currentQuestion = index;
            const questionData = questions[index];
            
            // Set question text
            document.getElementById("questionText").textContent = questionData.question;
            
            // Clear previous options
            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            
            // Add options
            questionData.options.forEach((option, i) => {
                const optionElement = document.createElement("div");
                optionElement.className = "option";
                optionElement.textContent = option.text;
                optionElement.onclick = function() { checkAnswer(i); };
                optionsContainer.appendChild(optionElement);
            });
            
            // Reset feedback and continue button
            document.getElementById("feedback").textContent = "";
            document.getElementById("feedback").style.backgroundColor = "transparent";
            document.getElementById("continueButton").style.display = "none";
            
            // Show question container with animation
            const questionContainer = document.getElementById("questionContainer");
            questionContainer.style.display = "block";
            setTimeout(() => {
                questionContainer.style.opacity = "1";
                questionContainer.style.transform = "translateY(0)";
            }, 10);
        }
        
        // Check the selected answer
        function checkAnswer(selectedIndex) {
            const questionData = questions[currentQuestion];
            const isCorrect = questionData.options[selectedIndex].correct;
            
            // Increment attempts and track answer
            questionData.attempts++;
            studentData.totalAttempts++;
            document.getElementById("totalAttempts").textContent = studentData.totalAttempts;
            
            // Calculate and store time to answer
            if (!questionData.timeToAnswer) {
                const now = new Date();
                questionData.timeToAnswer = (now - questionData.startTime) / 1000; // in seconds
            }
            
            // Store selected option
            questionData.selectedOption = selectedIndex;
            
            // Disable all option clicks after answer is selected
            const optionElements = document.querySelectorAll('.option');
            optionElements.forEach(element => {
                element.style.pointerEvents = 'none';
                element.style.opacity = '0.7';
            });
            
            // Show feedback
            const feedbackElement = document.getElementById("feedback");
            if (isCorrect) {
                feedbackElement.textContent = "Correct! Well done!";
                feedbackElement.style.color = "white";
                feedbackElement.style.backgroundColor = "#4CAF50";
                
                // Highlight correct answer
                optionElements[selectedIndex].style.backgroundColor = "#DFF2BF";
                optionElements[selectedIndex].style.borderLeft = "4px solid #4CAF50";
                optionElements[selectedIndex].style.opacity = "1";
                
                // Add explanation
                const explanation = document.createElement("div");
                explanation.className = "explanation";
                explanation.textContent = questionData.explanation;
                feedbackElement.appendChild(explanation);
                
                // Show continue button immediately
                document.getElementById("continueButton").style.display = "block";
                
                // Update progress and tracking
                updateProgressBar(askedQuestions.length / totalQuestions * 100);
                questionData.answeredCorrectly = true;
                
                // Update student stats
                studentData.correctAnswers++;
                document.getElementById("correctAnswers").textContent = studentData.correctAnswers;
                
                // Track student data
                studentData.questionAttempts.push({
                    questionIndex: currentQuestion,
                    question: questionData.question,
                    attemptsNeeded: questionData.attempts,
                    answeredCorrectly: true,
                    selectedAnswer: questionData.options[selectedIndex].text,
                    correctAnswer: getCorrectAnswer(questionData),
                    timeToAnswer: questionData.timeToAnswer
                });
                
                // Update accuracy
                updateAccuracy();
            } else {
                feedbackElement.textContent = "Incorrect. Try again.";
                feedbackElement.style.color = "white";
                feedbackElement.style.backgroundColor = "#F44336";
                
                // Highlight incorrect answer in red
                optionElements[selectedIndex].style.backgroundColor = "#FFBABA";
                optionElements[selectedIndex].style.borderLeft = "4px solid #F44336";
                
                // Track incorrect answer in student data
                if (questionData.attempts >= 2) {
                    // After second wrong attempt, show correct answer and continue
                    feedbackElement.textContent = "The correct answer is: " + getCorrectAnswer(questionData);
                    
                    // Add explanation
                    const explanation = document.createElement("div");
                    explanation.className = "explanation";
                    explanation.textContent = questionData.explanation;
                    feedbackElement.appendChild(explanation);
                    
                    // Track student data for incorrect final answer
                    studentData.questionAttempts.push({
                        questionIndex: currentQuestion,
                        question: questionData.question,
                        attemptsNeeded: questionData.attempts,
                        answeredCorrectly: false,
                        selectedAnswer: questionData.options[selectedIndex].text,
                        correctAnswer: getCorrectAnswer(questionData),
                        timeToAnswer: questionData.timeToAnswer
                    });
                    
                    // Update accuracy
                    updateAccuracy();
                    
                    // Show continue button after 2 seconds
                    setTimeout(() => {
                        document.getElementById("continueButton").style.display = "block";
                    }, 2000);
                } else {
                    // Re-enable options for another try
                    setTimeout(() => {
                        optionElements.forEach(element => {
                            element.style.pointerEvents = 'auto';
                            element.style.opacity = '1';
                        });
                        optionElements[selectedIndex].style.opacity = '0.7'; // Keep the wrong answer faded
                    }, 800);
                }
            }
        }
        
        // Get the correct answer text for a question
        function getCorrectAnswer(questionData) {
            for (let i = 0; i < questionData.options.length; i++) {
                if (questionData.options[i].correct) {
                    return questionData.options[i].text;
                }
            }
            return "";
        }
        
        // Update accuracy statistic
        function updateAccuracy() {
            const accuracy = Math.round((studentData.correctAnswers / studentData.totalAttempts) * 100);
            document.getElementById("accuracy").textContent = accuracy + "%";
        }
        
        // =========== BUTTON HANDLERS ===========
        
        // Set up event listener for the continue button
        document.getElementById("continueButton").addEventListener("click", function() {
            // Hide question container
            const questionContainer = document.getElementById("questionContainer");
            questionContainer.style.opacity = "0";
            questionContainer.style.transform = "translateY(10px)";
            
            setTimeout(() => {
                questionContainer.style.display = "none";
                
                // Reset the options for next time
                const optionElements = document.querySelectorAll('.option');
                optionElements.forEach(element => {
                    element.style.pointerEvents = 'auto';
                    element.style.opacity = '1';
                    element.style.backgroundColor = 'var(--nus-light-grey)';
                    element.style.borderLeft = '4px solid var(--nus-light-blue)';
                });
                
                // Reset feedback
                document.getElementById("feedback").style.backgroundColor = "transparent";
                document.getElementById("feedback").innerHTML = "";
                
                // Check if this was the last question
                if (askedQuestions.length === totalQuestions) {
                    // All questions answered, show summary
                    showSummary();
                } else {
                    // Resume video
                    player.playVideo();
                    
                    // Start checking time again
                    setTimeout(checkTime, 1000);
                }
            }, 300);
        });
        
        // Restart Video button event listener
        document.getElementById("restartVideoButton").addEventListener("click", function() {
            // Reset student data for a new session
            const oldId = studentData.id;
            studentData = {
                name: getUsername(),
                id: oldId + "_retry",      // Add retry suffix to session ID
                startTime: new Date(),
                endTime: null,
                totalTimeSpent: 0,
                videoWatchedPercentage: 0,
                questionAttempts: [],
                correctAnswers: 0,
                totalAttempts: 0,
                pageUrl: window.location.href
            };
            
            // Reset questions data
            questions.forEach(q => {
                q.attempts = 0;
                q.answeredCorrectly = false;
                q.selectedOption = null;
                q.timeToAnswer = 0;
            });
            
            // Reset UI elements
            document.getElementById("correctAnswers").textContent = "0";
            document.getElementById("totalAttempts").textContent = "0";
            document.getElementById("accuracy").textContent = "0%";
            document.getElementById("videoProgress").textContent = "0%";
            
            // Reset askedQuestions array
            askedQuestions = [];
            
            // Hide summary panel and show video container
            document.getElementById("summaryPanel").style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
            
            // Reset progress bar
            updateProgressBar(0);
            
            // Restart video from beginning
            player.seekTo(0);
            player.playVideo();
            
            // Start checking time again
            setTimeout(checkTime, 1000);
        });
        
        // =========== UTILITY FUNCTIONS ===========
        
        // Show summary at the end
        function showSummary() {
            // Calculate end time and total time spent
            studentData.endTime = new Date();
            studentData.totalTimeSpent = Math.floor((studentData.endTime - studentData.startTime) / 1000); // in seconds
            
            // Hide video container
            document.getElementById("videoContainer").style.display = "none";
            
            // Generate summary content
            const summaryContainer = document.getElementById("questionsSummary");
            summaryContainer.innerHTML = "";
            
            // Add each question to the summary
            questions.forEach((q, index) => {
                const questionDiv = document.createElement("div");
                questionDiv.className = "question-summary";
                
                const questionTitle = document.createElement("h3");
                questionTitle.textContent = `Question ${index + 1}: ${q.question}`;
                questionDiv.appendChild(questionTitle);
                
                const attemptsInfo = document.createElement("p");
                attemptsInfo.textContent = `Attempts: ${q.attempts}`;
                questionDiv.appendChild(attemptsInfo);
                
                const answerInfo = document.createElement("p");
                const studentAttempt = studentData.questionAttempts.find(a => a.questionIndex === index);
                
                if (studentAttempt && studentAttempt.answeredCorrectly) {
                    answerInfo.innerHTML = `Your answer: <span class="summary-correct">${studentAttempt.selectedAnswer}</span>`;
                } else if (studentAttempt) {
                    answerInfo.innerHTML = `Your answer: <span class="summary-incorrect">${studentAttempt.selectedAnswer}</span>`;
                    const correctAnswer = document.createElement("p");
                    correctAnswer.innerHTML = `Correct answer: <span class="summary-correct">${getCorrectAnswer(q)}</span>`;
                    questionDiv.appendChild(correctAnswer);
                } else {
                    answerInfo.textContent = "Question not attempted";
                }
                
                questionDiv.appendChild(answerInfo);
                
                // Add explanation for each question
                const explanationDiv = document.createElement("div");
                explanationDiv.className = "explanation";
                explanationDiv.textContent = q.explanation;
                questionDiv.appendChild(explanationDiv);
                
                summaryContainer.appendChild(questionDiv);
            });
            
            // Calculate overall score
            const overallScoreDiv = document.getElementById("overallScore");
            const scorePercentage = Math.round((studentData.correctAnswers / totalQuestions) * 100);
            overallScoreDiv.innerHTML = `
                <h3>Overall Performance</h3>
                <p>Score: ${studentData.correctAnswers} out of ${totalQuestions} (${scorePercentage}%)</p>
                <p>Total Time Spent: ${formatTime(studentData.totalTimeSpent)}</p>
                <p>Video Watched: ${studentData.videoWatchedPercentage}%</p>
            `;
            
            // Log student data and submit to tracking
            console.log("Student Data for Tracking:", studentData);
            submitVideoTrackData();
            
            // Show the summary panel
            document.getElementById("summaryPanel").style.display = "block";
        }
        
        // Format time in seconds to MM:SS format
        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }
        
        // Update progress bar
        function updateProgressBar(percentage) {
            document.getElementById("progressBar").style.width = percentage + "%";
        }
    </script>
</body>
