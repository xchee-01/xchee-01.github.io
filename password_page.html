<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            color: #f44336;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Protected Page</h1>
        <div>
            <input type="password" id="passwordInput" placeholder="Enter password">
            <button onclick="checkPassword()">Submit</button>
        </div>
        <p id="errorMessage" class="message">Incorrect password. Please try again.</p>
    </div>

    <script>
        // The password is stored in a hashed format for basic security
        // This uses SHA-256 which is a one-way hash function
        const correctPasswordHash = "6ca13d52ca70c883e0f0bb101e425a89e8624de51db2d2392593af6a84118090"; // This is "abc123"
        
        // Change the password above to your desired password
        // You can generate a SHA-256 hash of your password at https://emn178.github.io/online-tools/sha256.html
        
        async function sha256(message) {
            // Encode the message as UTF-8
            const msgBuffer = new TextEncoder().encode(message);
            
            // Hash the message with SHA-256
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            
            // Convert the hash to hex string
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            return hashHex;
        }
        
        async function checkPassword() {
            const passwordInput = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Hash the input password
            const inputHash = await sha256(passwordInput);
            
            if (inputHash === correctPasswordHash) {
                // Redirect to the specified URL if password is correct
                window.location.href = "https://xchee-01.github.io/index.html";
            } else {
                // Show error message if password is incorrect
                errorMessage.style.display = "block";
                
                // Clear the password field
                document.getElementById('passwordInput').value = "";
            }
        }

        // Allow submitting by pressing Enter
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
