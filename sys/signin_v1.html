<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sign In / Register</h2>
        <div id="error-message" class="error"></div>
        <form id="auth-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('auth-form');
            const errorMessage = document.getElementById('error-message');

            form.addEventListener('submit', function(event) {
                event.preventDefault();
                
                // Get input values
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Basic validation
                if (!username || !password) {
                    errorMessage.textContent = 'Please enter both username and password';
                    return;
                }

                // Create account object
                const account = {
                    username: username,
                    password: password
                };

                try {
                    // Create or update accounts array
                    let accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
                    
                    // Check if username already exists
                    const existingUserIndex = accounts.findIndex(acc => acc.username === username);
                    
                    if (existingUserIndex !== -1) {
                        // Update existing account
                        accounts[existingUserIndex] = account;
                    } else {
                        // Add new account
                        accounts.push(account);
                    }

                    // Save updated accounts
                    localStorage.setItem('accounts', JSON.stringify(accounts));

                    // Clear any previous error messages
                    errorMessage.textContent = '';

                    // Retrieve the return URL, defaulting to current origin if not set
                    const returnUrl = localStorage.getItem('returnUrl') || window.location.origin;
                    
                    // Remove the stored return URL
                    localStorage.removeItem('returnUrl');

                    // Redirect to the original page or a default page
                    window.location.href = returnUrl;
                } catch (error) {
                    errorMessage.textContent = 'Registration failed. Please try again.';
                    console.error('Registration error:', error);
                }
            });
        });
    </script>
</body>
</html>
