<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Debug Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f0f0f0;
        }
        .log {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .error {
            background: #ffe0e0;
            color: #d00;
        }
        .success {
            background: #e0ffe0;
            color: #080;
        }
    </style>
</head>
<body>
    <h1>Firebase Configuration Test</h1>
    <div id="logs"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    
    <script>
        const logDiv = document.getElementById('logs');
        
        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = 'log ' + (isError ? 'error' : 'success');
            div.textContent = `[${new Date().toISOString()}] ${message}`;
            logDiv.appendChild(div);
            console.log(message);
        }

        // Firebase Configuration - INLINE for testing
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBqCWa23G0V4JwcBOuwns4h6B0HslVz-vI",
            authDomain: "pwaapp-fe16c.firebaseapp.com",
            projectId: "pwaapp-fe16c",
            storageBucket: "pwaapp-fe16c.appspot.com",
            messagingSenderId: "938438328532",
            appId: "1:938438328532:web:YOUR_APP_ID" // UPDATE THIS!
        };

        log('Starting Firebase test...');
        
        try {
            log('Firebase SDK loaded: ' + (typeof firebase !== 'undefined'));
            log('Config: ' + JSON.stringify(FIREBASE_CONFIG, null, 2));
            
            // Initialize Firebase
            firebase.initializeApp(FIREBASE_CONFIG);
            log('Firebase initialized successfully!');
            
            // Test messaging
            const messaging = firebase.messaging();
            log('Firebase Messaging instance created');
            
            // Check if service worker is supported
            if ('serviceWorker' in navigator) {
                log('Service Worker supported');
            } else {
                log('Service Worker NOT supported', true);
            }
            
        } catch (error) {
            log('Error: ' + error.message, true);
            log('Stack: ' + error.stack, true);
        }
    </script>
</body>
</html>
