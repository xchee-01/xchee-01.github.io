<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Admin - Send Notification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
            color: #333;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .option-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .correct-option {
            margin-top: 10px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        .send-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .send-button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .send-button:disabled {
            background: #a0a0a0;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #e6fffa;
            color: #234e52;
            display: block;
        }

        .message.error {
            background: #fff5f5;
            color: #742a2a;
            display: block;
        }

        .instructions {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.6;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: #4c51bf;
        }

        .instructions code {
            background: #e0e7ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Send Quiz Notification</h1>
        
        <form id="notificationForm">
            <div class="form-group">
                <label for="question">Question:</label>
                <textarea id="question" required placeholder="Enter your quiz question...">What is the largest planet in our solar system?</textarea>
            </div>
            
            <div class="form-group">
                <label>Options:</label>
                <div class="option-inputs">
                    <input type="text" id="option1" required placeholder="Option A" value="Earth">
                    <input type="text" id="option2" required placeholder="Option B" value="Mars">
                    <input type="text" id="option3" required placeholder="Option C" value="Jupiter">
                    <input type="text" id="option4" required placeholder="Option D" value="Saturn">
                </div>
            </div>
            
            <div class="form-group correct-option">
                <label for="correct">Correct Answer:</label>
                <select id="correct" required>
                    <option value="0">Option A</option>
                    <option value="1">Option B</option>
                    <option value="2" selected>Option C</option>
                    <option value="3">Option D</option>
                </select>
            </div>
            
            <button type="submit" class="send-button" id="sendButton">
                Send Quiz Notification 🚀
            </button>
        </form>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        // OneSignal credentials
        const ONE_SIGNAL_APP_ID = 'b4f3116c-da50-4c0d-8833-00bbff722597';
        const ONE_SIGNAL_API_KEY = 'cfvluftpuejzufigipwam2bgf';
        
        document.getElementById('notificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const sendButton = document.getElementById('sendButton');
            const messageEl = document.getElementById('message');
            
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';
            
            // Gather form data
            const questionData = {
                question: document.getElementById('question').value,
                options: [
                    document.getElementById('option1').value,
                    document.getElementById('option2').value,
                    document.getElementById('option3').value,
                    document.getElementById('option4').value
                ],
                correct: parseInt(document.getElementById('correct').value)
            };
            
            // Encode question data for URL
            const encodedData = encodeURIComponent(JSON.stringify(questionData));
            const appUrl = window.location.origin + window.location.pathname.replace('admin.html', '');
            
            // OneSignal API payload
            const notificationPayload = {
                app_id: ONE_SIGNAL_APP_ID,
                included_segments: ['All'],
                headings: { en: 'New Quiz Question! 🎯' },
                contents: { en: questionData.question },
                url: `${appUrl}?question=${encodedData}`,
                web_url: `${appUrl}?question=${encodedData}`,
                chrome_web_icon: 'https://via.placeholder.com/192x192/667eea/ffffff?text=Q',
                firefox_icon: 'https://via.placeholder.com/192x192/667eea/ffffff?text=Q'
            };
            
            try {
                const response = await fetch('https://onesignal.com/api/v1/notifications', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Basic ${ONE_SIGNAL_API_KEY}`
                    },
                    body: JSON.stringify(notificationPayload)
                });
                
                const result = await response.json();
                
                if (response.ok && result.id) {
                    messageEl.className = 'message success';
                    messageEl.textContent = '✓ Notification sent successfully!';
                    
                    // Reset form
                    document.getElementById('notificationForm').reset();
                } else {
                    throw new Error(result.errors ? result.errors.join(', ') : 'Failed to send notification');
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = `✗ Error: ${error.message}`;
                console.error('Error sending notification:', error);
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = 'Send Quiz Notification 🚀';
                
                // Hide message after 5 seconds
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
