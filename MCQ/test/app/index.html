<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:disabled {
            background: #ccc;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Quiz App - Push Notifications</h1>
    
    <button id="enableBtn" onclick="subscribeToPush()">Enable Push Notifications</button>
    <button id="testBtn" onclick="sendTestNotification()" disabled>Send Test Notification</button>
    
    <div id="status"></div>
    
    <h2>Quiz Section</h2>
    <p>Your quiz content goes here...</p>

    <script src="app.js"></script>
</body>
</html>
