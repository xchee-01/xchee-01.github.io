<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App with Push Notifications</title>
    <link rel="manifest" href="https://xchee-01.github.io/MCQ/test/app/manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            border-left: 4px solid;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-left-color: #28a745;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-left-color: #17a2b8;
        }
        .debug {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        h3 {
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Quiz App - Push Notifications Setup</h1>
        
        <div id="status" class="status info">
            Welcome! Follow the steps below to enable push notifications.
        </div>

        <h3>Step 1: Enable Notifications</h3>
        <button id="enableBtn" onclick="subscribeToPush()">
            🔔 Enable Push Notifications
        </button>
        
        <h3>Step 2: Test Notification</h3>
        <button id="testBtn" onclick="sendTestNotification()" disabled>
            📨 Send Test Notification
        </button>
        
        <h3>Debug Information</h3>
        <button onclick="showDebugInfo()">🐛 Show Debug Info</button>
        <button onclick="clearDebugLog()">🗑️ Clear Debug Log</button>
        
        <div id="debug" class="debug" style="display:none;"></div>
        
        <h3>Quiz Section</h3>
        <p>Your quiz content will appear here...</p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    
    <!-- Your app script -->
    <script src="https://xchee-01.github.io/MCQ/test/app/app-firebase.js"></script>
</body>
</html>
