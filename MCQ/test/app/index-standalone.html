<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App with Push Notifications</title>
    <link rel="manifest" href="/MCQ/test/app/manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            border-left: 4px solid;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-left-color: #28a745;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-left-color: #17a2b8;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border-left-color: #ffc107;
        }
        .debug {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        h3 {
            color: #333;
            margin-top: 20px;
        }
        .token-display {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Quiz App - Push Notifications</h1>
        
        <div id="status" class="status info">
            Initializing...
        </div>

        <h3>Step 1: Enable Notifications</h3>
        <button id="enableBtn" onclick="subscribeToPush()" disabled>
            🔔 Enable Push Notifications
        </button>
        
        <h3>Step 2: Test Notification</h3>
        <button id="testBtn" onclick="sendTestNotification()" disabled>
            📨 Send Test Notification
        </button>
        
        <div id="tokenDisplay" class="token-display" style="display:none;">
            <strong>FCM Token:</strong>
            <div id="tokenValue"></div>
            <button onclick="copyToken()" style="margin-top: 10px;">📋 Copy Token</button>
        </div>
        
        <h3>Debug Information</h3>
        <button onclick="showDebugInfo()">🐛 Show Debug Info</button>
        <button onclick="clearDebugLog()">🗑️ Clear Debug Log</button>
        <button onclick="unregisterAll()" style="background: #dc3545;">🗑️ Reset Everything</button>
        
        <div id="debug" class="debug" style="display:none;"></div>
        
        <h3>Quiz Section</h3>
        <p>Your quiz content will appear here...</p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    
    <script>
        // ============ CONFIGURATION START ============
        const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBqrBRmxmJSZmjHTSWhikZEzBegaogIzQI",
  authDomain: "pwaapp-fe16c.firebaseapp.com",
  projectId: "pwaapp-fe16c",
  storageBucket: "pwaapp-fe16c.firebasestorage.app",
  messagingSenderId: "138452600697",
  appId: "1:138452600697:web:a1f3d2c96b1dafd84911a8"
        };

        const CONFIG = {
            GAS_ENDPOINT: 'https://script.google.com/macros/s/AKfycbwRUpi2Pai4DTuW-eZOK5RCWkA70c5wTunfqfpRgXDcz-PvEmF8nBDdXmhhWKxmSqptfQ/exec',
            VAPID_PUBLIC_KEY: 'BEXBjinVivC6jAfhKZov_HMujSaEBZf3PLfYt_01O3pGDzZRh2xzZAnBeiNFQO4vuryTQKUfx6gbPj2fTE4bcGE'
        };
        // ============ CONFIGURATION END ============

        // Debug logging
        const debugLog = {
            logs: [],
            add: function(message, data = null) {
                const timestamp = new Date().toISOString();
                const logEntry = `[${timestamp}] ${message}${data ? '\n' + JSON.stringify(data, null, 2) : ''}`;
                this.logs.push(logEntry);
                console.log(message, data || '');
                this.updateDisplay();
            },
            updateDisplay: function() {
                const debugElement = document.getElementById('debug');
                if (debugElement && debugElement.style.display !== 'none') {
                    debugElement.textContent = this.logs.join('\n\n');
                    debugElement.scrollTop = debugElement.scrollHeight;
                }
            },
            clear: function() {
                this.logs = [];
                this.updateDisplay();
            }
        };

        let messaging = null;
        let swRegistration = null;
        let currentToken = null;

        // Initialize on load
        window.addEventListener('load', async () => {
            debugLog.add('Page loaded');
            
            // Check if Firebase loaded
            if (typeof firebase === 'undefined') {
                updateStatus('Error: Firebase SDK failed to load', 'error');
                debugLog.add('ERROR: Firebase is undefined');
                return;
            }
            
            debugLog.add('Firebase SDK loaded');
            
            try {
                // Initialize Firebase
                firebase.initializeApp(FIREBASE_CONFIG);
                debugLog.add('Firebase initialized with config', FIREBASE_CONFIG);
                
                // Check browser support
                if (!('serviceWorker' in navigator)) {
                    updateStatus('Service Workers not supported!', 'error');
                    return;
                }
                
                if (!('PushManager' in window)) {
                    updateStatus('Push notifications not supported!', 'error');
                    return;
                }
                
                // Register service worker
                debugLog.add('Registering service worker...');
                swRegistration = await navigator.serviceWorker.register('/MCQ/test/app/firebase-messaging-sw.js');
                await navigator.serviceWorker.ready;
                debugLog.add('Service worker registered and ready');
                
                // Get messaging instance
                messaging = firebase.messaging();
                debugLog.add('Messaging instance created');
                
                // Check existing token
                try {
                    currentToken = await messaging.getToken({ 
                        vapidKey: CONFIG.VAPID_PUBLIC_KEY,
                        serviceWorkerRegistration: swRegistration 
                    });
                    
                    if (currentToken) {
                        debugLog.add('Existing token found:', currentToken);
                        displayToken(currentToken);
                        document.getElementById('enableBtn').disabled = true;
                        document.getElementById('testBtn').disabled = false;
                        updateStatus('✅ Push notifications already enabled!', 'success');
                    } else {
                        debugLog.add('No existing token');
                        document.getElementById('enableBtn').disabled = false;
                        updateStatus('Ready to enable push notifications', 'info');
                    }
                } catch (e) {
                    debugLog.add('Token check error:', e);
                    document.getElementById('enableBtn').disabled = false;
                    updateStatus('Ready to enable push notifications', 'info');
                }
                
                // Handle foreground messages
                messaging.onMessage((payload) => {
                    debugLog.add('Foreground message received:', payload);
                    const { title, body, icon } = payload.notification || {};
                    
                    // Show notification even in foreground
                    if (Notification.permission === 'granted') {
                        const notification = new Notification(title || 'New Message', { 
                            body: body || 'You have a new message',
                            icon: icon || '/icon-192x192.png',
                            tag: 'quiz-notification',
                            requireInteraction: false
                        });
                        
                        notification.onclick = function() {
                            window.focus();
                            notification.close();
                        };
                    }
                    
                    // Update UI
                    updateStatus(`📬 New message: ${title}`, 'success');
                });
                
            } catch (error) {
                debugLog.add('Initialization error:', error);
                updateStatus('Initialization failed: ' + error.message, 'error');
            }
        });

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            debugLog.add('Status update: ' + message);
        }

        function displayToken(token) {
            document.getElementById('tokenDisplay').style.display = 'block';
            document.getElementById('tokenValue').textContent = token;
            currentToken = token;
        }

        function copyToken() {
            if (currentToken) {
                navigator.clipboard.writeText(currentToken).then(() => {
                    updateStatus('Token copied to clipboard!', 'success');
                });
            }
        }

        async function subscribeToPush() {
            debugLog.add('Subscribe button clicked');
            
            try {
                // Request permission
                debugLog.add('Requesting notification permission...');
                const permission = await Notification.requestPermission();
                debugLog.add('Permission result: ' + permission);
                
                if (permission !== 'granted') {
                    updateStatus('❌ Notification permission denied!', 'error');
                    return;
                }
                
                // Get token with service worker registration
                debugLog.add('Getting FCM token...');
                const token = await messaging.getToken({ 
                    vapidKey: CONFIG.VAPID_PUBLIC_KEY,
                    serviceWorkerRegistration: swRegistration 
                });
                
                if (token) {
                    debugLog.add('Token received:', token);
                    displayToken(token);
                    
                    // Save to server
                    await saveTokenToServer(token);
                    
                    document.getElementById('enableBtn').disabled = true;
                    document.getElementById('testBtn').disabled = false;
                    updateStatus('✅ Push notifications enabled successfully!', 'success');
                } else {
                    throw new Error('No token received');
                }
                
            } catch (error) {
                debugLog.add('Subscribe error:', error);
                updateStatus('❌ Failed: ' + error.message, 'error');
                
                // If IndexedDB error, suggest reset
                if (error.message.includes('database')) {
                    updateStatus('❌ Database error. Try clicking "Reset Everything" and refresh.', 'error');
                }
            }
        }

        async function saveTokenToServer(token) {
            debugLog.add('Saving token to server...');
            
            const data = {
                action: 'subscribe',
                subscription: {
                    endpoint: `https://fcm.googleapis.com/fcm/send/${token}`,
                    keys: { p256dh: 'not-used', auth: 'not-used' }
                },
                fcmToken: token,
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            };
            
            try {
                const response = await fetch(CONFIG.GAS_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(data)
                });
                debugLog.add('Token saved to server (no-cors mode, no response available)');
            } catch (error) {
                debugLog.add('Server save error:', error);
                // Don't fail the whole process if server save fails
            }
        }

        async function sendTestNotification() {
            debugLog.add('Test notification button clicked');
            updateStatus('📤 Sending test notification...', 'info');
            
            try {
                await fetch(CONFIG.GAS_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'test',
                        fcmToken: currentToken,
                        timestamp: new Date().toISOString()
                    })
                });
                
                updateStatus('✅ Test notification request sent! Check for notification...', 'success');
                debugLog.add('Test request sent to server');
            } catch (error) {
                debugLog.add('Test error:', error);
                updateStatus('❌ Test failed: ' + error.message, 'error');
            }
        }

        async function unregisterAll() {
            if (!confirm('This will reset all notifications. Continue?')) return;
            
            try {
                // Delete token
                if (messaging && currentToken) {
                    await messaging.deleteToken();
                    debugLog.add('Token deleted');
                }
                
                // Unregister service workers
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                    await registration.unregister();
                }
                
                // Clear IndexedDB
                const dbs = ['fcm_token_details_db', 'firebase-messaging-database'];
                for (let db of dbs) {
                    await indexedDB.deleteDatabase(db);
                }
                
                updateStatus('✅ Reset complete. Please refresh the page.', 'success');
            } catch (error) {
                debugLog.add('Reset error:', error);
            }
        }

        function showDebugInfo() {
            const debug = document.getElementById('debug');
            debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
            debugLog.updateDisplay();
        }

        function clearDebugLog() {
            debugLog.clear();
            updateStatus('Debug log cleared', 'info');
        }
    </script>
</body>
</html>
