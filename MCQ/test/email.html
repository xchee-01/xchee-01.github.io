<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender - Microsoft Graph API</title>
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        textarea {
            height: 120px;
            resize: vertical;
        }
        
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            min-width: 150px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #74b9ff, #0984e3);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            min-height: 20px;
        }
        
        .success {
            background: rgba(0, 255, 0, 0.2);
            border-left: 4px solid #00ff00;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.2);
            border-left: 4px solid #ff0000;
        }
        
        .info {
            background: rgba(0, 123, 255, 0.2);
            border-left: 4px solid #007bff;
        }
        
        .button-group {
            text-align: center;
            margin-top: 30px;
        }
        
        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Quiz Reminder System</h1>
        
        <div id="userInfo" class="user-info">
            <strong>Logged in as:</strong> <span id="userName"></span>
        </div>
        
        <div class="form-group">
            <label for="recipientEmail">📬 Recipient Email:</label>
            <input type="email" id="recipientEmail" placeholder="student@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="emailSubject">📝 Subject:</label>
            <input type="text" id="emailSubject" value="🚨 Quiz Reminder - Action Required!" placeholder="Email subject">
        </div>
        
        <div class="form-group">
            <label for="emailBody">💬 Message:</label>
            <textarea id="emailBody" placeholder="Write your reminder message here...">Hello!

This is a friendly reminder that you have a pending quiz to complete.

📚 Quiz Details:
- Deadline: [Add deadline here]
- Duration: [Add duration here]
- Topics: [Add topics here]

Please complete it at your earliest convenience.

Best regards,
Your Instructor</textarea>
        </div>
        
        <div class="button-group">
            <button id="loginBtn" class="btn btn-secondary" onclick="signIn()">
                🔐 Login with Microsoft
            </button>
            <button id="sendBtn" class="btn" onclick="sendEmail()" disabled>
                <span id="sendBtnText">📨 Send Reminder</span>
            </button>
            <button id="logoutBtn" class="btn btn-secondary" onclick="signOut()" style="display: none;">
                🚪 Logout
            </button>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // Microsoft Graph API Configuration
        const msalConfig = {
            auth: {
                clientId: 'YOUR_CLIENT_ID_HERE', // You need to register an app in Azure AD
                authority: 'https://login.microsoftonline.com/common',
                redirectUri: window.location.origin
            },
            cache: {
                cacheLocation: 'localStorage',
                storeAuthStateInCookie: false
            }
        };

        const loginRequest = {
            scopes: ['User.Read', 'Mail.Send']
        };

        // Initialize MSAL
        const myMSALObj = new msal.PublicClientApplication(msalConfig);
        let accountId = '';

        // Check if user is already logged in
        window.addEventListener('load', () => {
            const currentAccounts = myMSALObj.getAllAccounts();
            if (currentAccounts.length > 0) {
                accountId = currentAccounts[0].homeAccountId;
                updateUI(currentAccounts[0]);
            }
        });

        async function signIn() {
            setStatus('🔄 Signing in...', 'info');
            
            try {
                const loginResponse = await myMSALObj.loginPopup(loginRequest);
                accountId = loginResponse.account.homeAccountId;
                updateUI(loginResponse.account);
                setStatus('✅ Successfully signed in!', 'success');
            } catch (error) {
                console.error(error);
                setStatus('❌ Sign in failed: ' + error.message, 'error');
            }
        }

        async function signOut() {
            try {
                await myMSALObj.logout();
                updateUI(null);
                setStatus('👋 Signed out successfully', 'info');
            } catch (error) {
                setStatus('❌ Sign out failed: ' + error.message, 'error');
            }
        }

        function updateUI(account) {
            const loginBtn = document.getElementById('loginBtn');
            const sendBtn = document.getElementById('sendBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const userInfo = document.getElementById('userInfo');
            const userName = document.getElementById('userName');

            if (account) {
                loginBtn.style.display = 'none';
                sendBtn.disabled = false;
                logoutBtn.style.display = 'inline-block';
                userInfo.style.display = 'block';
                userName.textContent = account.name || account.username;
            } else {
                loginBtn.style.display = 'inline-block';
                sendBtn.disabled = true;
                logoutBtn.style.display = 'none';
                userInfo.style.display = 'none';
            }
        }

        async function getAccessToken() {
            const account = myMSALObj.getAccountByHomeId(accountId);
            const accessTokenRequest = {
                scopes: ['Mail.Send'],
                account: account
            };

            try {
                const accessTokenResponse = await myMSALObj.acquireTokenSilent(accessTokenRequest);
                return accessTokenResponse.accessToken;
            } catch (error) {
                // Token might be expired, try to get a new one
                const accessTokenResponse = await myMSALObj.acquireTokenPopup(accessTokenRequest);
                return accessTokenResponse.accessToken;
            }
        }

        async function sendEmail() {
            const recipientEmail = document.getElementById('recipientEmail').value;
            const emailSubject = document.getElementById('emailSubject').value;
            const emailBody = document.getElementById('emailBody').value;
            const sendBtn = document.getElementById('sendBtn');
            const sendBtnText = document.getElementById('sendBtnText');

            // Validation
            if (!recipientEmail || !emailSubject || !emailBody) {
                setStatus('❌ Please fill in all fields', 'error');
                return;
            }

            if (!isValidEmail(recipientEmail)) {
                setStatus('❌ Please enter a valid email address', 'error');
                return;
            }

            // Start loading state
            sendBtn.disabled = true;
            sendBtnText.innerHTML = '<span class="loading"></span>Sending...';
            setStatus('📤 Sending email...', 'info');

            try {
                const accessToken = await getAccessToken();

                const emailData = {
                    message: {
                        subject: emailSubject,
                        body: {
                            contentType: 'Text',
                            content: emailBody
                        },
                        toRecipients: [{
                            emailAddress: {
                                address: recipientEmail
                            }
                        }]
                    }
                };

                const response = await fetch('https://graph.microsoft.com/v1.0/me/sendMail', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                });

                if (response.ok) {
                    setStatus(`✅ Email sent successfully to ${recipientEmail}!`, 'success');
                    // Clear the recipient field for next email
                    document.getElementById('recipientEmail').value = '';
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'Failed to send email');
                }

            } catch (error) {
                console.error('Error sending email:', error);
                setStatus('❌ Failed to send email: ' + error.message, 'error');
            } finally {
                // Reset button state
                sendBtn.disabled = false;
                sendBtnText.innerHTML = '📨 Send Reminder';
            }
        }

        function setStatus(message, type = '') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Handle Enter key in form fields
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                const activeElement = document.activeElement;
                if (activeElement.tagName === 'INPUT') {
                    event.preventDefault();
                    sendEmail();
                }
            }
        });
    </script>
</body>
</html>
