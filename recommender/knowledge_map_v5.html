<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Knowledge Map</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    /* --- Keep ALL your ORIGINAL CSS --- */
    body { /* ... */ }
    #header { /* ... */ }
    #title { /* ... */ }
    #container { /* ... */ }
    #sidebar { /* ... */ }
    #visualization { /* ... */ }
    #graph { /* ... */ }
    .node.parent { /* ... */ }
    .node.child { /* ... */ }
    .node:hover { /* ... */ }
    .link { /* ... */ }
    .link.parent-child { /* ... */ }
    .tooltip { /* ... */ }
    .filter-section, .legend, .summary-section, .recommendations { /* ... */ }
    /* ... etc ... */
    .node-label { /* ... */ }
    .node-label.parent { /* ... */ }
    .legend-item.node-type { /* ... */ }
    .legend-shape { /* ... */ }
    .legend-shape.parent { /* ... */ }
    .legend-shape.child { /* ... */ }
    #retry-button, #test-data-button { /* ... */ }
    .loader { /* ... */ }
    .spinner { /* ... */ }
    /* ... keep all other original styles ... */

    /* --- ADD NEW CSS FOR MODAL --- */
    .modal {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */
      z-index: 1000; /* Sit on top */
      left: 0;
      top: 0;
      width: 100%; /* Full width */
      height: 100%; /* Full height */
      overflow: auto; /* Enable scroll if needed */
      background-color: rgba(0,0,0,0.6); /* Black w/ opacity */
    }
    .modal-content {
      background-color: #fefefe;
      margin: 10% auto; /* 10% from the top and centered */
      padding: 25px;
      border: 1px solid #888;
      width: 80%; /* Could be more specific */
      max-width: 600px; /* Maximum width */
      border-radius: 8px;
      position: relative;
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2),0 6px 20px 0 rgba(0,0,0,0.19);
    }
    .close-button {
      color: #aaa;
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    .close-button:hover,
    .close-button:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    #modal-topic-title {
        margin-top: 0;
        color: #3f51b5;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
        margin-bottom: 15px;
    }
    #modal-steps p {
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.5;
        border-bottom: 1px dashed #eee;
        padding-bottom: 8px;
    }
     #modal-steps p:last-child { border-bottom: none; padding-bottom: 0; }
    #modal-steps a {
        color: #3f51b5;
        text-decoration: none;
        word-break: break-all;
    }
     #modal-steps a:hover { text-decoration: underline; }
    /* Optional: Style the new button */
    #recommend-topics-button {
        display: block;
        width: 100%;
        margin-top: 15px;
        padding: 10px 15px;
        font-size: 14px;
        background-color: #FF9800; /* Orange color like test button */
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }
     #recommend-topics-button:hover { background-color: #F57C00; }
     #recommend-topics-button:disabled { background-color: #bdbdbd; cursor: not-allowed; }
    /* --- END NEW CSS --- */

  </style>
</head>
<body>
  <div id="header">
    <h1 id="title">Student Coding Knowledge Map</h1>
  </div>

  <div id="container">
    <div id="sidebar">
      <!-- Keep ORIGINAL error message div -->
      <div id="error-message" style="display: none;">
         <p id="error-text"></p>
        <button id="retry-button">Retry</button>
        <button id="test-data-button">Use Test Data</button>
      </div>

      <!-- Keep ORIGINAL Filters -->
      <div class="filter-section">
        <h3>Mastery Level</h3>
        <!-- ... keep all filter options ... -->
      </div>
      <div class="filter-section">
          <h3>Node Type</h3>
          <!-- ... keep node type filter options ... -->
      </div>
      <div class="filter-section">
          <h3>Difficulty Level (Attempted)</h3>
          <!-- ... keep difficulty filter options ... -->
      </div>

      <!-- Keep ORIGINAL Legend -->
      <div class="legend">
        <h3>Legend</h3>
        <!-- ... keep all legend items ... -->
      </div>

      <!-- Keep ORIGINAL Summary -->
      <div class="summary-section">
        <h3>Knowledge Summary</h3>
        <div id="summary-stats">
          <div class="loader" id="summary-loader">
            <div class="spinner"></div>
            <p>Loading summary...</p>
          </div>
        </div>
      </div>

      <!-- Keep ORIGINAL Recommendations section -->
      <div class="recommendations">
        <h3>Recommendations</h3>
        <div id="recommendations-container">
           <div class="loader" id="recs-loader">
             <div class="spinner"></div>
             <p>Generating recommendations...</p>
           </div>
        </div>
        <!-- *** ADD THE NEW BUTTON HERE *** -->
        <button id="recommend-topics-button" disabled>Recommend Learning Path</button>
      </div>
    </div> <!-- End Sidebar -->

    <!-- Keep ORIGINAL Visualization Area -->
    <div id="visualization">
      <svg id="graph"></svg>
      <div class="tooltip" id="tooltip"></div>
      <div class="controls">
        <button class="control-button" id="zoom-in">Zoom In</button>
        <button class="control-button" id="zoom-out">Zoom Out</button>
        <button class="control-button" id="reset-zoom">Reset View</button>
      </div>
      <div class="loader" id="main-loader">
        <div class="spinner"></div>
        <p>Loading knowledge map...</p>
      </div>
    </div> <!-- End Visualization -->
  </div> <!-- End Container -->

  <!-- *** ADD NEW MODAL STRUCTURE (just before closing </body>) *** -->
  <div id="learning-path-modal" class="modal">
    <div class="modal-content">
      <span class="close-button" id="modal-close-button">×</span>
      <h3 id="modal-topic-title">Learning Path</h3>
      <div id="modal-steps">
        <p>Loading learning path...</p>
      </div>
    </div>
  </div>

  <script>
    // --- Configuration ---
    const apiUrl = 'https://script.google.com/macros/s/AKfycbwv8iDMpLh7M_Ct1og2oamvzBddv4QRoK9DuZRfvQsOTHuY2NAv7W8v-kcRmLjk8eFD/exec'; // UPDATE IF NEEDED

    // --- Global Variables ---
    // Keep original globals
    let knowledgeData = null; // *** This will now hold { nodes, links, learningPaths } ***
    let simulation = null;
    let svg = null;
    let zoom = null;

    // --- DOM Elements ---
    // Keep original DOM element variables
    const errorMessageDiv = document.getElementById('error-message');
    const errorTextP = document.getElementById('error-text');
    const retryButton = document.getElementById('retry-button');
    const testDataButton = document.getElementById('test-data-button');
    const mainLoader = document.getElementById('main-loader');
    const summaryLoader = document.getElementById('summary-loader');
    const recsLoader = document.getElementById('recs-loader');
    const summaryStatsDiv = document.getElementById('summary-stats');
    const recommendationsContainer = document.getElementById('recommendations-container');
    const graphSvg = document.getElementById('graph');
    const tooltipDiv = document.getElementById('tooltip');
    // *** ADD NEW DOM Elements for Modal and Button ***
    const recommendButton = document.getElementById('recommend-topics-button');
    const learningPathModal = document.getElementById('learning-path-modal');
    const modalCloseButton = document.getElementById('modal-close-button');
    const modalTitle = document.getElementById('modal-topic-title');
    const modalStepsContainer = document.getElementById('modal-steps');


    // --- Event Listeners ---
    document.addEventListener('DOMContentLoaded', function() {
      if (!apiUrl || apiUrl === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') { /* ... keep original config check ... */ }

      errorMessageDiv.style.display = 'none';
      recommendButton.disabled = true; // Disable button initially

      retryButton.addEventListener('click', function() { /* ... keep original retry logic ... */
          errorMessageDiv.style.display = 'none';
          mainLoader.style.display = 'block';
          summaryLoader.style.display = 'block';
          recsLoader.style.display = 'block';
          summaryStatsDiv.innerHTML = '<div class="loader" id="summary-loader"><div class="spinner"></div><p>Loading summary...</p></div>'; // Reset loaders
          recommendationsContainer.innerHTML = '<div class="loader" id="recs-loader"><div class="spinner"></div><p>Generating recommendations...</p></div>';
          recommendButton.disabled = true; // Disable button on retry
          loadData();
       });

      testDataButton.addEventListener('click', function() { /* ... keep original test data logic ... */
          errorMessageDiv.style.display = 'none';
          mainLoader.style.display = 'block';
          summaryLoader.style.display = 'block';
          recsLoader.style.display = 'block';
          summaryStatsDiv.innerHTML = '<div class="loader" id="summary-loader"><div class="spinner"></div><p>Loading summary...</p></div>'; // Reset loaders
          recommendationsContainer.innerHTML = '<div class="loader" id="recs-loader"><div class="spinner"></div><p>Generating recommendations...</p></div>';
          recommendButton.disabled = true; // Disable button
          setTimeout(() => {
              try {
                 // *** Ensure test data includes learningPaths ***
                 const testData = generateTestData();
                 // Store globally like real data
                 knowledgeData = testData;
                 renderKnowledgeMap(testData); // Pass nodes/links part if preferred, but render needs global knowledgeData later
              } catch (error) { /* ... error handling ... */ }
          }, 50);
      });

      // *** ADD NEW Event Listeners for Modal and Button ***
      recommendButton.addEventListener('click', showLearningPathRecommendation);
      modalCloseButton.addEventListener('click', () => { learningPathModal.style.display = 'none'; });
      window.addEventListener('click', (event) => {
          if (event.target === learningPathModal) { learningPathModal.style.display = 'none'; }
      });

      // Load data immediately
      loadData();
    });

    // --- Core Functions ---

    function loadData() {
      console.log('Attempting to load data from:', apiUrl);
      mainLoader.style.display = 'block';
      summaryLoader.style.display = 'block';
      recsLoader.style.display = 'block';
      errorMessageDiv.style.display = 'none';
      recommendButton.disabled = true; // Ensure button is disabled while loading

      const callbackName = 'jsonp_callback_' + Date.now() + '_' + Math.round(10000 * Math.random());
      const timeoutId = setTimeout(() => { /* ... keep original timeout logic ... */ }, 15000);

      window[callbackName] = function(data) {
        clearTimeout(timeoutId);
        console.log('Received data via JSONP callback:', callbackName);
        try {
           if (data && data.error) { /* ... keep original error handling ... */ }
           // *** SLIGHT MODIFICATION: Check for all parts and store globally ***
           else if (data && data.nodes && data.links && data.learningPaths !== undefined) {
               knowledgeData = data; // Store the whole structure globally
               renderKnowledgeMap(knowledgeData); // Pass data to render
               recommendButton.disabled = false; // *** Enable button on successful load ***
           } else {
               console.error('Invalid data structure received:', data);
               showError('Received invalid data structure from server. Expected nodes, links, and learningPaths.');
           }
        } catch (error) { /* ... keep original catch block ... */
        } finally {
          cleanupJsonp(script, callbackName);
        }
      };

      const script = document.createElement('script');
      script.src = apiUrl + (apiUrl.includes('?') ? '&' : '?') + 'callback=' + callbackName + '&_=' + Date.now();
      script.onerror = function(event) { /* ... keep original script error handling ... */ };
      document.head.appendChild(script);
    }

    // Keep original cleanupJsonp function
    function cleanupJsonp(scriptElement, callbackName) { /* ... */ }

    // Keep original showError function, add button disabling
     function showError(message) {
      mainLoader.style.display = 'none';
      summaryLoader.style.display = 'none';
      recsLoader.style.display = 'none';
      d3.select('#graph').selectAll('*').remove();
      summaryStatsDiv.innerHTML = '<p>Unavailable</p>';
      recommendationsContainer.innerHTML = '<p>Unavailable</p>';
      errorTextP.textContent = message;
      errorMessageDiv.style.display = 'block';
      recommendButton.disabled = true; // *** Disable button on error ***
    }

    // --- D3 Rendering and Interaction ---

    // Keep ORIGINAL renderKnowledgeMap function (it implicitly uses global knowledgeData for node/link properties)
    // No need to pass learningPaths specifically here, it's used later by the button click
    function renderKnowledgeMap(data) { // `data` here is the full {nodes, links, learningPaths}
       console.log('Rendering knowledge map...'); // Removed data log, it's large
       mainLoader.style.display = 'none';

       // Use data.nodes and data.links for rendering
       if (!data || !data.nodes || !data.links) {
           showError('Invalid data for rendering (missing nodes or links).');
           return;
       }

       const visContainer = document.getElementById('visualization');
       const width = visContainer.clientWidth;
       const height = visContainer.clientHeight;

       if (width <= 0 || height <= 0) { /* ... error handling ... */ }

       d3.select('#graph').selectAll('*').remove();
       zoom = d3.zoom().scaleExtent([0.2, 8]).on('zoom', (event) => g.attr('transform', event.transform));
       svg = d3.select('#graph').attr('width', width).attr('height', height).call(zoom).on("dblclick.zoom", null);
       const g = svg.append('g');
       svg.mainG = g;

       const numNodes = data.nodes.length;
       const linkDistance = Math.max(100, Math.min(200, 120 + numNodes * 0.5));
       const chargeStrength = Math.max(-1000, Math.min(-200, -300 - numNodes * 2));

       if (simulation) simulation.stop();
       simulation = d3.forceSimulation(data.nodes) // Use data.nodes
         .force('link', d3.forceLink(data.links).id(d => d.id).distance(d => d.source.isParent !== d.target.isParent ? linkDistance * 0.7 : linkDistance).strength(d => d.source.isParent !== d.target.isParent ? 0.8 : 0.6)) // Use data.links
         // ... other forces ...
         .force('charge', d3.forceManyBody().strength(d => d.isParent ? chargeStrength * 1.5 : chargeStrength))
         .force('center', d3.forceCenter(width / 2, height / 2).strength(0.1))
         .force('collide', d3.forceCollide().radius(d => getNodeSize(d) + 10).strength(0.8))
         .force('x', d3.forceX(width / 2).strength(0.05))
         .force('y', d3.forceY(height / 2).strength(0.05));

       const link = g.append('g').attr('class', 'links').selectAll('line')
            .data(data.links).enter().append('line') // Use data.links
            .attr('class', d => d.source.isParent !== d.target.isParent ? 'link parent-child' : 'link')
            .attr('stroke-width', d => Math.max(1, Math.sqrt(d.strength || 0.1) * 2.5));

       const nodeGroup = g.append('g').attr('class', 'nodes').selectAll('g.node-group')
            .data(data.nodes).enter().append('g') // Use data.nodes
            .attr('class', 'node-group')
            .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended))
            .on('mouseover', showTooltip).on('mouseout', hideTooltip);

       nodeGroup.append('circle') /* ... */
            .attr('class', d => `node ${d.isParent ? 'parent' : 'child'}`)
            .attr('r', d => getNodeSize(d))
            .attr('fill', d => getNodeColor(d));
       nodeGroup.append('text') /* ... */
             .attr('class', d => `node-label ${d.isParent ? 'parent' : ''}`)
             .attr('dy', d => getNodeSize(d) + (d.isParent ? 16 : 12))
             .text(d => d.name.length > 25 ? d.name.substring(0, 22) + '...' : d.name)
             .attr('display', 'none'); // Initially hidden

       simulation.on('tick', () => { /* ... update positions ... */ });

       // Keep original zoom controls setup
       const zoomInButton = document.getElementById('zoom-in'); /* ... clone and re-attach listeners ... */
       const zoomOutButton = document.getElementById('zoom-out');
       const resetZoomButton = document.getElementById('reset-zoom');
        zoomInButton.replaceWith(zoomInButton.cloneNode(true));
        zoomOutButton.replaceWith(zoomOutButton.cloneNode(true));
        resetZoomButton.replaceWith(resetZoomButton.cloneNode(true));
        document.getElementById('zoom-in').addEventListener('click', () => svg.transition().duration(300).call(zoom.scaleBy, 1.3));
        document.getElementById('zoom-out').addEventListener('click', () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.3));
        document.getElementById('reset-zoom').addEventListener('click', () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity));


       // Keep original filters setup
       setupFilters(); // Uses global knowledgeData implicitly via SVG elements
       applyFilters();

       // Keep original summary and recommendations update
       updateSummary(data.nodes);       // Use data.nodes
       generateRecommendations(data.nodes); // Use data.nodes
     }

    // Keep ORIGINAL getNodeSize, getNodeColor, showTooltip, hideTooltip, drag functions
    function getNodeSize(d) { /* ... */ }
    function getNodeColor(d) { /* ... */ }
    function showTooltip(event, d) { /* ... */ }
    function hideTooltip() { /* ... */ }
    function dragstarted(event, d) { /* ... */ }
    function dragged(event, d) { /* ... */ }
    function dragended(event, d) { /* ... */ }

    // Keep ORIGINAL Filtering Logic (setupFilters, applyFilters)
    function setupFilters() { /* ... */ }
    function applyFilters() { /* ... uses svg.mainG which has data bound */ }

    // Keep ORIGINAL Sidebar Updates (updateSummary, generateRecommendations)
    function updateSummary(nodes) { /* ... */ }
    function generateRecommendations(nodes) { /* ... */ }


    // --- *** ADD NEW Learning Path Recommendation Logic *** ---
    function showLearningPathRecommendation() {
        console.log("Recommend button clicked");
        // Use the globally stored knowledgeData
        if (!knowledgeData || !knowledgeData.nodes || !knowledgeData.learningPaths) {
            alert("Recommendation data is not available. Please wait for the map to load or try reloading.");
            console.error("Missing knowledgeData or required properties for recommendations.");
            return;
        }

        modalStepsContainer.innerHTML = '<p>Calculating recommendation...</p>';
        learningPathModal.style.display = 'block';

        const parentNodes = knowledgeData.nodes.filter(d => d.isParent);
        const weakParentNodes = parentNodes.filter(d => d.mastery === 'Needs Work' || d.mastery === 'Developing');

        if (weakParentNodes.length === 0) {
             modalTitle.textContent = "Recommendation";
             modalStepsContainer.innerHTML = "<p>Great job! No specific main topics require urgent attention based on current performance.</p>";
             return;
        }

        weakParentNodes.sort((a, b) => { /* ... sort logic ... */
            if (a.mastery === 'Needs Work' && b.mastery !== 'Needs Work') return -1;
            if (a.mastery !== 'Needs Work' && b.mastery === 'Needs Work') return 1;
            return (a.performance || 0) - (b.performance || 0);
        });

        const worstTopicNode = weakParentNodes[0];
        const worstTopicId = worstTopicNode.conceptId;

        // Use knowledgeData.learningPaths
        const pathUrls = knowledgeData.learningPaths[worstTopicId];

        modalTitle.textContent = `Recommended Learning Path for: ${worstTopicNode.name}`;

        if (pathUrls && pathUrls.length > 0) {
            let stepsHtml = '';
            pathUrls.forEach((url, index) => { /* ... format steps ... */
                let displayName = url; try { const urlParts = url.split('/'); const lastPart = urlParts[urlParts.length - 1]; displayName = lastPart.replace(/\.html?$/i, '').replace(/[_-]/g, ' '); displayName = displayName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '); } catch (e) {}
                stepsHtml += `<p><strong>Step ${index + 1}:</strong> <a href="${url}" target="_blank" title="${url}">${displayName}</a></p>`;
            });
            modalStepsContainer.innerHTML = stepsHtml;
        } else {
            modalStepsContainer.innerHTML = `<p>No specific learning path steps found for "${worstTopicNode.name}" (ID: ${worstTopicId}).</p>`;
        }
    }


    // --- Test Data Generation ---
    // Keep ORIGINAL generateTestData, but ensure it returns the correct structure
    function generateTestData() {
        console.log("Generating test data...");
        // ... (keep original node/link generation) ...
        const parentConcepts = [{ id: "1", name: "String Data Type" }, { id: "2", name: "Numeric Types" }];
        const childConcepts = [ { id: "1.1", /*...*/ }, { id: "1.2", /*...*/ }, { id: "2.1", /*...*/ }, { id: "2.2", /*...*/ }];
        const nodes = []; /* ... generate nodes ... */
        const links = []; /* ... generate links ... */

        // *** ADD mock learningPaths data ***
        const mockLearningPaths = {
            "1": [ "https://example.com/python/strings/intro.html", "https://example.com/python/strings/quiz.html" ],
            "2": [ "https://example.com/python/numbers/types.html", "https://example.com/python/numbers/operations.html", "https://example.com/python/numbers/quiz.html" ]
        };

        // *** Return the COMPLETE structure ***
        return { nodes, links, learningPaths: mockLearningPaths };
    }
  </script>
