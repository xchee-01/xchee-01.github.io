<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Data Types Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .question-container {
      margin-bottom: 20px;
    }
    .options-container {
      margin-bottom: 20px;
    }
    .option {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background-color: #f0f0f0;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .option:hover {
      background-color: #e0e0e0;
    }
    .option input {
      margin-right: 10px;
    }
    .btn {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
      margin-right: 10px;
    }
    .btn:hover {
      background-color: #3367d6;
    }
    .btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .explanation-container {
      margin-top: 20px;
      padding: 15px;
      background-color: #e8f4fe;
      border-radius: 4px;
      display: none;
    }
    .hint-container {
      margin-top: 10px;
      padding: 10px;
      background-color: #fff8e1;
      border-radius: 4px;
    }
    .code-snippet {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
      margin-top: 10px;
      overflow-x: auto;
    }
    .media-link {
      margin-top: 10px;
    }
    .correct {
      background-color: #d4edda;
    }
    .incorrect {
      background-color: #f8d7da;
    }
    .loading {
      text-align: center;
      margin: 20px 0;
      font-style: italic;
    }
    .question-id {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 4px;
      margin: 20px 0;
      text-align: center;
    }
    .meta-info {
      display: flex;
      flex-wrap: wrap;
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
    }
    .meta-item {
      margin-right: 15px;
      background: #eee;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .buttons-container {
      display: flex;
      margin-bottom: 20px;
    }
    .tracking-status {
      font-size: 12px;
      color: #4285f4;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Python Data Types Quiz</h1>
    
    <div id="loading" class="loading">Loading question...</div>
    <div id="error-message" class="error" style="display:none;"></div>
    
    <div id="question-area" style="display:none;">
      <div class="meta-info">
        <div class="meta-item" id="question-id"></div>
        <div class="meta-item" id="difficulty-level"></div>
        <div class="meta-item" id="learning-concept"></div>
      </div>
      
      <div class="question-container" id="question-text"></div>
      
      <div class="options-container" id="options-container"></div>
      
      <div class="buttons-container">
        <button id="submit-btn" class="btn">Submit Answer</button>
        <button id="hint-btn" class="btn">Show Hint</button>
        <button id="next-btn" class="btn" style="display:none;">Next Question</button>
      </div>
      
      <div id="tracking-status" class="tracking-status"></div>
      
      <div id="explanation-container" class="explanation-container">
        <h3>Explanation:</h3>
        <div id="explanation-text"></div>
        
        <div id="hint-container" class="hint-container" style="display:none;">
          <h3>Hint:</h3>
          <div id="hint-text"></div>
        </div>
        
        <div id="code-container" style="display:none;">
          <h3>Code Snippet:</h3>
          <div id="code-snippet" class="code-snippet"></div>
        </div>
        
        <div id="media-container" style="display:none;">
          <h3>Media:</h3>
          <div id="media-link" class="media-link"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Global variables
    let currentQuestion = null;
    let selectedOption = null;
    
    // Configure your Google Apps Script Web App URL here
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7jFHUaZwGGfbZA3CRs0T_NL4zxFMGPKYerkGK8q74TqcJ7FCPAOEi_AYl98CKUF8q/exec';
    
    // Initialize the quiz when the page loads
    window.onload = function() {
      getRandomQuestion();
      
      // Set up the hint button event
      document.getElementById('hint-btn').onclick = function() {
        document.getElementById('explanation-container').style.display = 'block';
        document.getElementById('hint-container').style.display = 'block';
        this.style.display = 'none';
      };
    };
    
    // Get a random question from the server
    function getRandomQuestion() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('question-area').style.display = 'none';
      document.getElementById('explanation-container').style.display = 'none';
      document.getElementById('submit-btn').style.display = 'inline-block';
      document.getElementById('hint-btn').style.display = 'inline-block';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('hint-container').style.display = 'none';
      document.getElementById('error-message').style.display = 'none';
      document.getElementById('tracking-status').style.display = 'none';
      
      // Reset selected option
      selectedOption = null;
      
      // Fetch a random question from the Google Apps Script
      fetch(`${GOOGLE_SCRIPT_URL}?action=getRandomQuestion`)
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            showError(data.error);
          } else {
            displayQuestion(data);
          }
        })
        .catch(error => showError(error.message || 'Failed to fetch question'));
    }
    
    // Display the question and options
    function displayQuestion(questionData) {
      if (!questionData) {
        showError("No questions available");
        return;
      }
      
      // Log data for debugging
      console.log("Question data received:", questionData);
      
      currentQuestion = questionData;
      
      // Set question ID and metadata
      document.getElementById('question-id').textContent = "ID: " + (questionData.id || "N/A");
      document.getElementById('difficulty-level').textContent = "Difficulty: " + (questionData.difficultyLevel || "N/A");
      document.getElementById('learning-concept').textContent = "Topic: " + (questionData.learningConcepts || "N/A");
      
      // Set question text
      document.getElementById('question-text').innerHTML = questionData.text || "No question text available";
      
      // Set options
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      // Handle options in different formats
      let optionsArray = [];
      if (questionData.options) {
        if (typeof questionData.options === 'string') {
          // Try different delimiters if \n doesn't work
          if (questionData.options.includes('\n')) {
            optionsArray = questionData.options.split('\n');
          } else if (questionData.options.includes(',')) {
            optionsArray = questionData.options.split(',');
          } else {
            optionsArray = [questionData.options]; // Single option
          }
          optionsArray = optionsArray.filter(opt => opt.trim() !== '');
        } else if (Array.isArray(questionData.options)) {
          optionsArray = questionData.options;
        }
      }
      
      if (optionsArray.length === 0) {
        const errorMsg = document.createElement('div');
        errorMsg.innerHTML = '<p style="color: red;">Error: No options available for this question. Please check your spreadsheet.</p>';
        optionsContainer.appendChild(errorMsg);
        document.getElementById('submit-btn').disabled = true;
        return;
      }
      
      // Create option elements
      optionsArray.forEach((option, index) => {
        const optionElement = document.createElement('label');
        optionElement.className = 'option';
        
        const radioInput = document.createElement('input');
        radioInput.type = 'radio';
        radioInput.name = 'answer';
        radioInput.value = option;
        radioInput.onclick = function() {
          selectedOption = option;
          document.getElementById('submit-btn').disabled = false;
        };
        
        optionElement.appendChild(radioInput);
        optionElement.appendChild(document.createTextNode(option));
        optionsContainer.appendChild(optionElement);
      });
      
      // Set up hint content
      document.getElementById('hint-text').innerHTML = questionData.hints || "No hints available.";
      
      // Set up code snippet
      if (questionData.codeSnippets && questionData.codeSnippets.trim() !== '') {
        document.getElementById('code-snippet').innerHTML = questionData.codeSnippets;
        document.getElementById('code-container').style.display = 'block';
      } else {
        document.getElementById('code-container').style.display = 'none';
      }
      
      // Show the question area and hide loading
      document.getElementById('loading').style.display = 'none';
      document.getElementById('question-area').style.display = 'block';
      
      // Set up the submit button
      document.getElementById('submit-btn').onclick = submitAnswer;
      document.getElementById('submit-btn').disabled = true;
      
      // Set up the next button
      document.getElementById('next-btn').onclick = getRandomQuestion;
    }
    
    // Submit the answer and show explanation
    function submitAnswer() {
      if (!selectedOption) {
        alert("Please select an answer");
        return;
      }
      
      // Show the correct answer and explanation
      const optionElements = document.querySelectorAll('.option');
      optionElements.forEach(optEl => {
        const inputEl = optEl.querySelector('input');
        const optionText = inputEl.value;
        
        if (optionText === currentQuestion.correctAnswer) {
          optEl.classList.add('correct');
        } else if (optionText === selectedOption && optionText !== currentQuestion.correctAnswer) {
          optEl.classList.add('incorrect');
        }
        
        // Disable all inputs
        inputEl.disabled = true;
      });
      
      // Show explanation
      document.getElementById('explanation-text').innerHTML = currentQuestion.explanation || "No explanation available.";
      document.getElementById('explanation-container').style.display = 'block';
      
      // Show media links if available
      if (currentQuestion.mediaLinks && currentQuestion.mediaLinks.trim() !== '') {
        // Check if it's a URL and create a link, otherwise just display text
        if (currentQuestion.mediaLinks.startsWith('http')) {
          document.getElementById('media-link').innerHTML = 
            `<a href="${currentQuestion.mediaLinks}" target="_blank">${currentQuestion.mediaLinks}</a>`;
        } else {
          document.getElementById('media-link').innerHTML = currentQuestion.mediaLinks;
        }
        document.getElementById('media-container').style.display = 'block';
      } else {
        document.getElementById('media-container').style.display = 'none';
      }
      
      // Hide submit and hint buttons, show next button
      document.getElementById('submit-btn').style.display = 'none';
      document.getElementById('hint-btn').style.display = 'none';
      document.getElementById('next-btn').style.display = 'inline-block';
      
      // Track the response
      trackResponse();
    }
    
    // Track the user's response in the spreadsheet
    function trackResponse() {
      const isCorrect = selectedOption === currentQuestion.correctAnswer;
      
      // Prepare the data to send
      const responseData = {
        timestamp: new Date().toISOString(),
        questionId: currentQuestion.id,
        questionText: currentQuestion.text,
        selectedOption: selectedOption,
        correctAnswer: currentQuestion.correctAnswer,
        isCorrect: isCorrect,
        difficultyLevel: currentQuestion.difficultyLevel || "N/A",
        learningConcepts: currentQuestion.learningConcepts || "N/A",
        questionType: currentQuestion.questionType || "N/A",
        bloomsLevel: currentQuestion.bloomsLevel || "N/A"
      };
      
      // Display tracking status
      const trackingStatus = document.getElementById('tracking-status');
      trackingStatus.textContent = "Saving your response...";
      trackingStatus.style.display = 'block';
      
      // Send the data to Google Apps Script
      const formData = new FormData();
      formData.append('action', 'trackResponse');
      formData.append('data', JSON.stringify(responseData));
      
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
      })
      .then(() => {
        trackingStatus.textContent = "Response saved!";
        setTimeout(() => {
          trackingStatus.style.display = 'none';
        }, 3000);
      })
      .catch(error => {
        trackingStatus.textContent = "Error saving response. Please try again.";
        console.error("Error tracking response:", error);
      });
    }
    
    // Show error message
    function showError(error) {
      const errorElement = document.getElementById('error-message');
      errorElement.textContent = "Error: " + error;
      errorElement.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }
  </script>
</body>
</html>
