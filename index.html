<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUS Score Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #003D7C; /* NUS Blue */
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 150px;
            height: auto;
            margin-right: 20px;
        }
        
        h1 {
            color: #003D7C; /* NUS Blue */
            margin: 0;
        }
        
        .score-display {
            font-size: 4rem;
            font-weight: bold;
            color: #003D7C; /* NUS Blue */
            margin: 20px 0;
        }
        
        .btn {
            background-color: #EF7C00; /* NUS Orange */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        
        .btn:hover {
            background-color: #FF8C10;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .footer {
            margin-top: 20px;
            color: #003D7C; /* NUS Blue */
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- NUS Logo from GitHub -->
            <img class="logo" src="https://raw.githubusercontent.com/xchee-01/xchee-01.github.io/main/NUS_logo.png" alt="NUS Logo">
            <h1>NUS Score Counter</h1>
        </div>
        
        <div>
            <p>Current Score:</p>
            <div class="score-display" id="score">0</div>
            <button class="btn" id="addPoints">Add 10 Points</button>
        </div>
        
        <div class="footer">
            <p>National University of Singapore</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const scoreElement = document.getElementById('score');
            const addButton = document.getElementById('addPoints');
            let score = 0;
            
            addButton.addEventListener('click', function() {
                score += 10;
                scoreElement.textContent = score;
                
                // Add a little animation effect
                scoreElement.style.transform = 'scale(1.2)';
                setTimeout(function() {
                    scoreElement.style.transform = 'scale(1)';
                }, 200);
            });
        });
    </script>
</body>
</html>
