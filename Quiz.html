<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA or RNA Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
            line-height: 1.6;
        }
        .quiz-container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .question {
            margin-bottom: 20px;
            font-weight: bold;
        }
        .options {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="question">
            Which molecule contains the base Uracil?
        </div>
        
        <div class="options">
            <button class="btn" onclick="checkAnswer('dna')">DNA</button>
            <button class="btn" onclick="checkAnswer('rna')">RNA</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        function checkAnswer(selected) {
            const resultDiv = document.getElementById('result');
            
            if (selected === 'rna') {
                resultDiv.style.color = 'green';
                resultDiv.textContent = 'Correct! RNA contains Uracil instead of Thymine.';
            } else {
                resultDiv.style.color = 'red';
                resultDiv.textContent = 'Incorrect. RNA contains Uracil, not DNA.';
            }
        }
    </script>
</body>
</html>
