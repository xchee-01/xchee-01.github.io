<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Login</title>
</head>
<body>
    <h2>User Login</h2>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" required><br><br>
        
        <button type="submit">Login</button>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // Fetch users from Google Sheet
                const response = await fetch('https://opensheet.vercel.app/1ks1d7AF-nSezGvl2ZuoxjMkAQteDmpjzNPN14WNum6k/Username');
                const users = await response.json();

                // Check for matching username and password
                const matchedUser = users.find(user => 
                    user[0] === username && user[1] === password
                );

                if (matchedUser) {
                    // Store login details in various storage mechanisms
                    localStorage.setItem('username', username);
                    localStorage.setItem('password', password);
                    sessionStorage.setItem('username', username);
                    sessionStorage.setItem('password', password);

                    // Store in IndexedDB
                    const dbName = 'UserDatabase';
                    const request = indexedDB.open(dbName, 1);
                    
                    request.onupgradeneeded = function(event) {
                        const db = event.target.result;
                        db.createObjectStore('users', { keyPath: 'username' });
                    };

                    request.onsuccess = function(event) {
                        const db = event.target.result;
                        const transaction = db.transaction(['users'], 'readwrite');
                        const store = transaction.objectStore('users');
                        
                        store.put({
                            username: username,
                            password: password
                        });
                    };

                    // Redirect to specified page
                    window.location.href = 'https://xchee-01.github.io/index.html';
                } else {
                    alert('Invalid username or password');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login failed. Please try again.');
            }
        });
    </script>
</body>
</html>
