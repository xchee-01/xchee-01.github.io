<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Checkpoint</title>
    <style>
        /* NUS Colors */
        :root {
            --nus-blue: #003D7C;
            --nus-orange: #EF7C00;
            --nus-light-blue: #4D7CAE;
            --nus-gray: #666666;
            --nus-light-gray: #f5f5f5;
            --nus-dark-gray: #333333;
            --nus-red: #c41230;
            --nus-green: #2E8540;
        }

        .mcq-container {
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 24px;
            margin: 20px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-left: 4px solid var(--nus-blue);
        }

        .mcq-heading {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            color: var(--nus-blue);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .mcq-heading i {
            margin-right: 12px;
            color: var(--nus-orange);
            font-size: 1.8rem;
        }

        .mcq-question {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
            color: var(--nus-dark-gray);
        }

        .mcq-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mcq-option {
            position: relative;
            padding: 15px;
            border-radius: 6px;
            background-color: white;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .mcq-option:hover {
            border-color: var(--nus-light-blue);
            transform: translateY(-2px);
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .mcq-option input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .mcq-option-text {
            flex: 1;
            pointer-events: none;
        }

        .mcq-feedback {
            display: none;
            margin-top: 8px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .correct {
            background-color: #e8f5e9;
            border-left: 3px solid var(--nus-green);
            color: #2E7D32;
        }

        .incorrect {
            background-color: #ffebee;
            border-left: 3px solid var(--nus-red);
            color: #c62828;
        }

        .mcq-option.selected-correct {
            background-color: #e8f5e9;
            border-color: var(--nus-green);
        }

        .mcq-option.selected-incorrect {
            background-color: #ffebee;
            border-color: var(--nus-red);
        }

        .reset-button {
            background-color: var(--nus-light-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .reset-button:hover {
            background-color: var(--nus-blue);
            transform: translateY(-2px);
        }

        .reset-button:active {
            transform: translateY(0);
        }

        .mcq-option-badge {
            display: inline-block;
            background-color: var(--nus-light-gray);
            color: var(--nus-dark-gray);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mcq-container">
        <div class="mcq-heading">
            <i class="fas fa-brain"></i>
            Learning Checkpoint
        </div>
        <div class="mcq-question">
            <strong>Would you use an integer or something else to represent a patient's temperature? Why?</strong>
        </div>
        <div class="mcq-options">
            <label class="mcq-option" data-correct="false">
                <input type="radio" name="temperature-type" value="option1">
                <div class="mcq-option-text">
                    <strong>Integer</strong><span class="mcq-option-badge">int</span> - Patient temperatures should be stored as whole numbers to save memory.
                </div>
                <div class="mcq-feedback incorrect">
                    <i class="fas fa-times-circle"></i> Not quite right. Patient temperatures typically include decimal points (e.g., 37.2°C), which can't be accurately represented by integers. Precision is critical in medical contexts.
                </div>
            </label>
            <label class="mcq-option" data-correct="true">
                <input type="radio" name="temperature-type" value="option2">
                <div class="mcq-option-text">
                    <strong>Float</strong><span class="mcq-option-badge">float</span> - Patient temperatures often include decimal points requiring precise measurement.
                </div>
                <div class="mcq-feedback correct">
                    <i class="fas fa-check-circle"></i> Correct! Body temperatures are measured with decimal precision (e.g., 37.2°C or 98.6°F). Using a float allows you to capture this precision, which is essential for accurate medical assessment.
                </div>
            </label>
            <label class="mcq-option" data-correct="false">
                <input type="radio" name="temperature-type" value="option3">
                <div class="mcq-option-text">
                    <strong>Integer</strong><span class="mcq-option-badge">int</span> - Temperatures can be multiplied by 10 to store decimals as integers (e.g., 372 instead of 37.2).
                </div>
                <div class="mcq-feedback incorrect">
                    <i class="fas fa-times-circle"></i> While this approach could work technically, it introduces unnecessary complexity and the risk of conversion errors. It's more straightforward and safer to use floats for values that naturally have decimal points.
                </div>
            </label>
            <label class="mcq-option" data-correct="false">
                <input type="radio" name="temperature-type" value="option4">
                <div class="mcq-option-text">
                    <strong>String</strong><span class="mcq-option-badge">str</span> - Patient temperatures should be stored as text to include the unit (°C or °F).
                </div>
                <div class="mcq-feedback incorrect">
                    <i class="fas fa-times-circle"></i> While strings can store temperature values with units, they don't allow for direct mathematical operations (like calculating averages or comparing values). It's better to use floats for the temperature value and handle units separately.
                </div>
            </label>
        </div>
        <button class="reset-button">
            <i class="fas fa-redo"></i> Try Again
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const options = document.querySelectorAll('.mcq-option');
            const resetButton = document.querySelector('.reset-button');
            
            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Clear previous selections
                    options.forEach(opt => {
                        opt.classList.remove('selected-correct');
                        opt.classList.remove('selected-incorrect');
                        opt.querySelector('.mcq-feedback').style.display = 'none';
                    });
                    
                    // Get and show appropriate feedback
                    const isCorrect = this.getAttribute('data-correct') === 'true';
                    const feedback = this.querySelector('.mcq-feedback');
                    
                    if (isCorrect) {
                        this.classList.add('selected-correct');
                    } else {
                        this.classList.add('selected-incorrect');
                    }
                    
                    feedback.style.display = 'block';
                    resetButton.style.display = 'flex';
                });
            });
            
            resetButton.addEventListener('click', function() {
                options.forEach(option => {
                    option.classList.remove('selected-correct');
                    option.classList.remove('selected-incorrect');
                    option.querySelector('.mcq-feedback').style.display = 'none';
                    option.querySelector('input[type="radio"]').checked = false;
                });
                resetButton.style.display = 'none';
            });
        });
    </script>
</body>
</html>
