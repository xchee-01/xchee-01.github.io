<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atom Model</title>
  <style>
    body {
      background: #fff; /* White background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .atom {
      position: relative;
      width: 200px;
      height: 200px;
    }

    /* Nucleus */
    .nucleus {
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, #ff4d4d, #990000);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px #ff6666;
    }

    /* Orbit */
    .orbit {
      width: 100%;
      height: 100%;
      border: 1px dashed #000; /* Black orbit */
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
      animation: spin 6s linear infinite;
    }

    /* Electron */
    .electron {
      width: 10px;
      height: 10px;
      background: #00ccff; /* Blue electron */
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -150%);
      box-shadow: 0 0 10px #00ccff;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="atom">
  <div class="nucleus"></div>
  <div class="orbit">
    <div class="electron"></div>
  </div>
</div>

</body>
</html>
