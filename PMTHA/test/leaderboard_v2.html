<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUS Performance Leaderboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nus-blue: #003D7C;
            --nus-orange: #EF7C00;
            --background: #f5f7fa;
            --card-bg: #ffffff;
            --text-primary: #2b2d42;
            --text-secondary: #6c757d;
            --light-blue: rgba(0, 61, 124, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--background);
            background-image: linear-gradient(135deg, #f5f7fa 0%, #e4ecfb 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .header h1 {
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--nus-blue);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;

        .leaderboard-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);

            padding-bottom: 10px;
        }

        .leaderboard-header {
            background: var(--nus-blue);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            display: flex;

            align-items: center;
        }

        .leaderboard-header h2 {
            font-weight: 600;
            font-size: 1.4rem;
            margin: 0;
        }

        .leaderboard-header .stats {
            display: flex;
            gap: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .student-row {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            align-items: center;
            background: white;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);

        .student-row:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 61, 124, 0.2);
        }

        .student-row.top-1 {
            background: linear-gradient(135deg, rgba(239, 124, 0, 0.1) 0%, rgba(255, 255, 255, 1) 100%);
            border-left: 4px solid var(--nus-orange);
        }

        .student-row.top-2, .student-row.top-3 {
            background: linear-gradient(135deg, rgba(0, 61, 124, 0.05) 0%, rgba(255, 255, 255, 1) 100%);
            border-left: 4px solid var(--nus-blue);
        }

        .rank-cell {
            text-align: center;
        }

        .rank-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }

        .rank-badge.gold {
            background: var(--nus-orange);
            color: white;
        }

        .rank-badge.other {
            background: var(--nus-blue);
            color: white;
        }

        .rank-badge.regular {
            background: #f8f9fa;
            color: var(--text-primary);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .student-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score-cell {
            text-align: right;
        }

        .score-value {
            font-weight: 700;
            color: var(--nus-blue);
        }

        .list-container {
            padding: 0 20px 20px 20px;
        }

        .list-header {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 10px 20px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 40px 0;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 61, 124, 0.1);
            border-radius: 50%;
            border-top-color: var(--nus-blue);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }

        .loading p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: #dc3545;
            text-align: center;
            padding: 20px;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .retry-button {
            background: var(--nus-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        
        .retry-button:hover {
            background: var(--nus-orange);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .last-updated {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 20px;
        }

        /* Animation */
        .student-row {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* New styles for student score bars */
        .student-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .student-score-bar-container {
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            margin-top: 3px;
        }

        .student-score-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--nus-blue) 0%, var(--nus-orange) 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .accuracy-value {
            color: var(--nus-orange);
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .leaderboard-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .student-row, .list-header {
                grid-template-columns: 60px 1fr 80px;
                padding: 12px 15px;
            }
            
            .rank-badge {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-award"></i> NUS Performance Leaderboard</h1>
            <p>Tracking student performance and achievement</p>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading performance data...</p>
        </div>
        
        <div id="leaderboard" class="leaderboard-container" style="display: none;">
            <div class="leaderboard-header">
                <h2><i class="fas fa-trophy"></i> Student Performance</h2>
                <div id="stats" class="stats">
                    <!-- Will be filled by JavaScript -->
                </div>
            </div>
            
            <div class="list-container">
                <div class="list-header">
                    <div style="text-align: center;">Rank</div>
                    <div>Student</div>
                    <div style="text-align: right;">Score</div>
                </div>
                <div id="studentList">
                    <!-- Will be filled by JavaScript -->
                </div>
            </div>
        </div>
        
        <div id="last-updated" class="last-updated">
            <!-- Will be filled by JavaScript -->
        </div>
    </div>

    <script>
        // Configuration - Your Google Apps Script web app URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbzFA9_O_c7HJWfu8M960LIEer06iAPMOivVE6GWzRdRispCzCUXqKydeQD2gfRnys_L/exec';
        
        // Google Spreadsheet ID and sheet name
        const SPREADSHEET_ID = '19NXpyi3Rd-kkIOvUlZBhIcDkJ9Y4bhp16zYCqOiMF9c';
        const SHEET_NAME = 'Performance Matrix';
        
        // Load the leaderboard data when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadLeaderboard();
        });
        
        function loadLeaderboard() {
            // Show loading state
            document.getElementById('loading').style.display = 'block';
            document.getElementById('leaderboard').style.display = 'none';
            
            // Create a unique callback name for JSONP
            const callbackName = 'jsonpCallback_' + Math.round(Math.random() * 1000000);
            
            // Define the callback function
            window[callbackName] = function(data) {
                try {
                    // Process the Google Sheet data
                    const processedData = processSheetData(data);
                    
                    // Display the leaderboard
                    displayLeaderboard(processedData);
                    
                    // Clean up
                    if (script.parentNode) {
                        document.body.removeChild(script);
                    }
                    delete window[callbackName];
                } catch (error) {
                    console.error('Error processing data:', error);
                    showError('Error processing the data: ' + error.message);
                }
            };
            
            // Use JSONP to fetch the data from Google Apps Script
            const script = document.createElement('script');
            script.src = `${API_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(SHEET_NAME)}&callback=${callbackName}`;
            
            script.onerror = function() {
                showError('Failed to connect to the Google Sheet. Please check the URL and permissions.');
                
                // Clean up
                if (script.parentNode) {
                    document.body.removeChild(script);
                }
                delete window[callbackName];
            };
            
            // Add script to DOM to start the request
            document.body.appendChild(script);
            
            // Set a longer timeout (20 seconds)
            setTimeout(function() {
                if (document.getElementById('leaderboard').style.display === 'none') {
                    showError('Request timed out. Please check your connection and try again.');
                    
                    // Clean up
                    if (script.parentNode) {
                        document.body.removeChild(script);
                    }
                    delete window[callbackName];
                }
            }, 20000);
        }
        
        function processSheetData(data) {
            // For debugging
            console.log('Received data:', data);
            
            if (!data || !data.values || !Array.isArray(data.values)) {
                console.error('Invalid data format received');
                throw new Error('Invalid data format received from server');
            }
            
            try {
                // Find the total number of questions from cell A3
                let totalQuestions = 8; // Default to 8 based on the screenshot
                for (let i = 0; i < data.values.length; i++) {
                    if (i === 2 && data.values[i][0]) { // A3 is index 2,0
                        const possibleValue = parseInt(data.values[i][0]);
                        if (!isNaN(possibleValue)) {
                            totalQuestions = possibleValue;
                            console.log("Found total questions:", totalQuestions);
                            break;
                        }
                    }
                }
                
                // Find the header row with "Student"
                let headerRowIndex = -1;
                for (let i = 0; i < data.values.length; i++) {
                    if (data.values[i].indexOf("Student") >= 0) {
                        headerRowIndex = i;
                        break;
                    }
                }
                
                if (headerRowIndex === -1) {
                    throw new Error("Could not find the Student header row");
                }
                
                const headers = data.values[headerRowIndex];
                
                // Find the indices for important columns
                const nameIndex = headers.indexOf('Student');
                const totalScoreIndex = headers.indexOf('Total Score');
                const accuracyIndex = headers.indexOf('Accuracy');
                
                if (nameIndex === -1 || totalScoreIndex === -1 || accuracyIndex === -1) {
                    console.warn("Missing required columns:", {
                        nameIndex,
                        totalScoreIndex,
                        accuracyIndex,
                        headers
                    });
                }
                
                // Process each student row
                const students = [];
                for (let i = headerRowIndex + 1; i < data.values.length; i++) {
                    const row = data.values[i];
                    
                    // Skip rows without student names
                    if (!row[nameIndex]) continue;
                    
                    // Parse accuracy from column L (should be in accuracyIndex)
                    let accuracyText = String(row[accuracyIndex] || '0%');
                    let accuracyValue = parseFloat(accuracyText.replace('%', '')) || 0;
                    
                    students.push({
                        name: row[nameIndex],
                        score: parseInt(row[totalScoreIndex] || 0),
                        accuracy: accuracyValue,
                        accuracyText: accuracyValue.toFixed(0) + '%'
                    });
                }
                
                // Sort by score (descending)
                students.sort((a, b) => b.score - a.score);
                
                // Return processed data
                return {
                    totalQuestions: totalQuestions,
                    lastUpdated: data.lastUpdated || new Date().toLocaleString(),
                    students: students
                };
            } catch (error) {
                console.error('Error processing sheet data:', error);
                throw error;
            }
        }
        
        function displayStats(data) {
            const statsContainer = document.getElementById('stats');
            statsContainer.innerHTML = '';
            
            // Calculate stats
            const totalStudents = data.students.length;
            
            // Create stat elements
            const statsData = [
                { value: totalStudents, label: 'Students' },
                { value: data.totalQuestions, label: 'Questions' }
            ];
            
            statsData.forEach(stat => {
                const statDiv = document.createElement('div');
                statDiv.className = 'stat';
                
                const valueDiv = document.createElement('div');
                valueDiv.className = 'stat-value';
                valueDiv.textContent = stat.value;
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'stat-label';
                labelDiv.textContent = stat.label;
                
                statDiv.appendChild(valueDiv);
                statDiv.appendChild(labelDiv);
                statsContainer.appendChild(statDiv);
            });
        }
        
        function displayStudentList(data) {
            const listContainer = document.getElementById('studentList');
            listContainer.innerHTML = '';
            
            // Add each student to the list
            data.students.forEach((student, index) => {
                const rank = index + 1;
                
                // Create student row
                const row = document.createElement('div');
                row.className = 'student-row';
                
                // Add special class for top performers
                if (rank === 1) {
                    row.classList.add('top-1');
                } else if (rank <= 3) {
                    row.classList.add('top-3');
                }
                
                // Rank badge
                const rankCell = document.createElement('div');
                rankCell.className = 'rank-cell';
                
                const rankBadge = document.createElement('div');
                if (rank === 1) {
                    rankBadge.className = 'rank-badge gold';
                } else if (rank <= 3) {
                    rankBadge.className = 'rank-badge other';
                } else {
                    rankBadge.className = 'rank-badge regular';
                }
                rankBadge.textContent = rank;
                rankCell.appendChild(rankBadge);
                
                // Student details including name and accuracy bar
                const detailsCell = document.createElement('div');
                detailsCell.className = 'student-details';
                
                // Student name
                const nameDiv = document.createElement('div');
                nameDiv.className = 'student-name';
                nameDiv.textContent = student.name;
                
                // Score bar
                const scoreBarContainer = document.createElement('div');
                scoreBarContainer.className = 'student-score-bar-container';
                
                const scoreBar = document.createElement('div');
                scoreBar.className = 'student-score-bar';
                // Calculate width based on score relative to total questions
                const scorePercentage = (student.score / data.totalQuestions) * 100;
                scoreBar.style.width = `${scorePercentage}%`;
                
                scoreBarContainer.appendChild(scoreBar);
                
                // Accuracy display
                const accuracyValueDiv = document.createElement('div');
                accuracyValueDiv.className = 'accuracy-value';
                accuracyValueDiv.textContent = `Accuracy: ${student.accuracyText}`;
                
                // Add elements to details cell
                detailsCell.appendChild(nameDiv);
                detailsCell.appendChild(scoreBarContainer);
                detailsCell.appendChild(accuracyValueDiv);
                
                // Score cell
                const scoreCell = document.createElement('div');
                scoreCell.className = 'score-cell';
                
                const scoreValue = document.createElement('div');
                scoreValue.className = 'score-value';
                scoreValue.textContent = `${student.score}/${data.totalQuestions}`;
                
                scoreCell.appendChild(scoreValue);
                
                // Add all cells to the row
                row.appendChild(rankCell);
                row.appendChild(detailsCell);
                row.appendChild(scoreCell);
                
                // Add row to the list
                listContainer.appendChild(row);
            });
        }
        
        function displayLeaderboard(data) {
            // Update last updated time
            document.getElementById('last-updated').textContent = `Last updated: ${data.lastUpdated}`;
            
            // Display stats
            displayStats(data);
            
            // Display student list
            displayStudentList(data);
            
            // Hide loading indicator and show leaderboard
            document.getElementById('loading').style.display = 'none';
            document.getElementById('leaderboard').style.display = 'block';
            
            // Animate student rows one by one
            const studentRows = document.querySelectorAll('.student-row');
            studentRows.forEach((row, index) => {
                row.style.animationDelay = `${index * 0.05}s`;
            });
        }
        
        function showError(message) {
            document.getElementById('loading').innerHTML = 
                `<div class="error-message">
                    <i class="fas fa-exclamation-circle"></i> ${message}
                    <button onclick="retryLoad()" class="retry-button">
                        <i class="fas fa-sync-alt"></i> Retry
                    </button>
                </div>`;
        }
        
        function retryLoad() {
            // Reset loading state
            document.getElementById('loading').innerHTML = `
                <div class="spinner"></div>
                <p>Attempting to reconnect...</p>
            `;
            
            // Try loading again
            loadLeaderboard();
        }
    </script>
</body>
</html>
