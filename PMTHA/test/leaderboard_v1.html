<script>
    // Configuration - Update with your new deployed Google Apps Script web app URL
    const API_URL = 'YOUR_NEW_DEPLOYMENT_URL_HERE';
    
    // Google Spreadsheet ID and sheet name
    const SPREADSHEET_ID = '19NXpyi3Rd-kkIOvUlZBhIcDkJ9Y4bhp16zYCqOiMF9c';
    const SHEET_NAME = 'Performance Matrix';
    
    // Load the leaderboard data when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        loadLeaderboard();
    });
    
    function loadLeaderboard() {
        // Show loading state
        document.getElementById('loading').style.display = 'block';
        document.getElementById('leaderboard').style.display = 'none';
        
        // Create a unique callback name for JSONP
        const callbackName = 'jsonpCallback_' + Math.round(Math.random() * 1000000);
        
        // Create global callback function
        window[callbackName] = function(data) {
            try {
                // Process the Google Sheet data
                const processedData = processSheetData(data);
                
                // Display the leaderboard
                displayLeaderboard(processedData);
                
                // Clean up
                if (script.parentNode) {
                    document.body.removeChild(script);
                }
                delete window[callbackName];
            } catch (error) {
                console.error('Error processing data:', error);
                showError('Error processing the data: ' + error.message);
            }
        };
        
        // Use JSONP to fetch the data from Google Apps Script
        const script = document.createElement('script');
        script.src = `${API_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(SHEET_NAME)}&callback=${callbackName}`;
        
        script.onerror = function() {
            showError('Failed to connect to the Google Sheet. Please check the URL and permissions.');
            
            // Clean up
            if (script.parentNode) {
                document.body.removeChild(script);
            }
            delete window[callbackName];
        };
        
        // Add script to DOM to start the request
        document.body.appendChild(script);
        
        // Set a longer timeout (20 seconds)
        setTimeout(function() {
            if (document.getElementById('leaderboard').style.display === 'none') {
                showError('Request timed out. Please check your connection and try again.');
                
                // Clean up
                if (script.parentNode) {
                    document.body.removeChild(script);
                }
                delete window[callbackName];
            }
        }, 20000);
    }
    
    // Include the updated processSheetData function here
    function processSheetData(data) {
        // For debugging
        console.log('Received data:', data);
        
        if (!data || !data.values || !Array.isArray(data.values)) {
            console.error('Invalid data format received');
            return getFallbackData();
        }
        
        try {
            // In your sheet, the actual headers are in row 3 (index 3)
            const headerRowIndex = 3;
            const headers = data.values[headerRowIndex];
            
            // Data rows start after the header row
            const rows = data.values.slice(headerRowIndex + 1);
            
            // Find total questions from the sheet data
            // You have a row that says "Total number of questions" followed by the count
            let totalQuestions = data.totalQuestions || 5; // Use API value or default
            if (totalQuestions === 0) {
                // Try to find from sheet data
                for (let i = 0; i < data.values.length; i++) {
                    if (data.values[i][0] === "Total number of questions" && i+1 < data.values.length) {
                        const possibleValue = data.values[i+1][0];
                        if (!isNaN(possibleValue)) {
                            totalQuestions = parseInt(possibleValue);
                            break;
                        }
                    }
                }
            }
            
            // Find indices for the important columns
            const nameIndex = headers.indexOf('Student');
            const totalScoreIndex = headers.indexOf('Total Score');
            const accuracyIndex = headers.indexOf('Accuracy');
            
            // Process each student row
            const students = [];
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                
                // Skip rows without student names
                if (!row[nameIndex]) continue;
                
                // Create student object
                students.push({
                    name: row[nameIndex],
                    score: parseInt(row[totalScoreIndex] || 0),
                    accuracy: row[accuracyIndex] || '0%'
                });
            }
            
            // Sort by score (descending)
            students.sort((a, b) => b.score - a.score);
            
            // Return processed data
            return {
                totalQuestions: totalQuestions,
                lastUpdated: data.lastUpdated || new Date().toLocaleString(),
                students: students
            };
        } catch (error) {
            console.error('Error processing sheet data:', error);
            return getFallbackData();
        }
    }
    
    // Fallback data function in case of errors
    function getFallbackData() {
        return {
            totalQuestions: 5,
            lastUpdated: new Date().toLocaleString() + ' (Demo Data)',
            students: [
                { name: "f", score: 4, accuracy: "100%" },
                { name: "c", score: 3, accuracy: "100%" },
                { name: "e", score: 3, accuracy: "75%" },
                { name: "xavierchee", score: 3, accuracy: "75%" },
                { name: "d", score: 2, accuracy: "67%" },
                { name: "b", score: 2, accuracy: "50%" },
                { name: "a", score: 1, accuracy: "25%" }
            ]
        };
    }
    
    // Keep the rest of your display functions as they are...
</script>
