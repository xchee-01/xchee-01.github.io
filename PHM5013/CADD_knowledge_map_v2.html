<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADD Knowledge Graph (Dependencies)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        svg {
            border: 1px solid #ccc;
            background-color: #fff;
        }
        .node circle {
            stroke: #333; /* Darker stroke for better visibility */
            stroke-width: 1.5px;
            cursor: pointer; /* Indicate interactivity */
        }
        /* Style Module 0 differently */
        .node.module-0 circle {
             stroke: #black;
             stroke-width: 2.5px;
        }
        .node text {
            font-size: 10px;
            pointer-events: none; /* Text shouldn't interfere with dragging */
            text-anchor: middle;
            alignment-baseline: middle;
            fill: #333;
        }
         .node .module-text {
             font-weight: bold;
             font-size: 12px;
             fill: black;
         }
        .link {
            stroke: #999;
            stroke-opacity: 0.6;
            stroke-width: 1.5px; /* Slightly thicker links */
        }
         /* Style for prerequisite links (can be optional) */
         .link.prereq {
             stroke: #555;
             stroke-width: 2px;
         }
        .tooltip {
            position: absolute;
            text-align: center;
            padding: 6px;
            font: 12px sans-serif;
            background: lightsteelblue;
            border: 0px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        /* Style for arrowheads */
        svg defs marker {
            fill: #999;
        }
         svg defs marker.prereq-arrow {
             fill: #555;
         }

    </style>
</head>
<body>

<svg width="960" height="700">
    <!-- Definition for arrow markers -->
    <defs>
        <marker id="arrow" viewBox="0 -5 10 10" refX="28" refY="0" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,-5L10,0L0,5"></path>
        </marker>
        <marker id="prereq-arrow" class="prereq-arrow" viewBox="0 -5 10 10" refX="30" refY="0" markerWidth="7" markerHeight="7" orient="auto">
             <path d="M0,-5L10,0L0,5"></path>
         </marker>
    </defs>
</svg>
<div class="tooltip"></div>

<script>
    // 1. Data Preparation
    const modulesData = `
## Module 0: Foundations of Drug Discovery
### 0.1. Drug Discovery Context
### 0.2. Basic Chemistry for Drug Discovery
### 0.3. Biological Targets and Ligands
### 0.4. Molecular Interactions
### 0.5. Protein-Ligand Binding Fundamentals
### 0.6. Computational Representation of Molecules
### 0.7. Computing Fundamentals for CADD

## Module 1: Ligand-Based Virtual Screening (LBVS)
### 1.1. LBVS Fundamentals
### 1.2. Molecular Descriptors
### 1.3. Molecular Fingerprints
### 1.4. Pharmacophore-Based Screening
### 1.5. Shape-Based Screening
### 1.6. LBVS Practical Applications

## Module 2: Structure-Based Virtual Screening (SBVS)
### 2.1. Structural Biology Foundations
### 2.2. Interaction Analysis in Protein-Ligand Complexes
### 2.3. Molecular Docking Preparation
### 2.4. Docking Algorithms
### 2.5. Scoring Functions
### 2.6. SBVS Implementation

## Module 3: Quantitative Structure-Activity Relationship (QSAR)
### 3.1. QSAR Fundamentals
### 3.2. Medicinal Chemistry Principles for QSAR
### 3.3. Molecular Descriptors for QSAR
### 3.4. QSAR Modeling Techniques
### 3.5. Model Validation and Evaluation
### 3.6. QSAR Applications

## Module 4: Machine Learning-Based Virtual Screening (MLVS)
### 4.1. ML Foundations for Drug Discovery
### 4.2. Feature Representation for ML
### 4.3. ML Algorithms for CADD
### 4.4. Advanced ML Methods
### 4.5. ML Implementation in Drug Discovery

## Module 5: Molecular Dynamics (MD) Simulation
### 5.1. Physical Chemistry Foundations for MD
### 5.2. MD Fundamentals
### 5.3. Solvation Models
### 5.4. MD System Setup
### 5.5. Production MD
### 5.6. Enhanced Sampling Techniques
### 5.7. MD Analysis
### 5.8. MD Applications

## Module 6: ADME/Tox Predictions and Drug-Like Properties
### 6.1. ADME Fundamentals
### 6.2. Chemical Basis of ADME Properties
### 6.3. Toxicity Prediction
### 6.4. Drug Optimization Strategies

## Module 7: Integration and Practical Applications
### 7.1. Integrated Approaches
### 7.2. Case Studies and Applications
### 7.3. Practical Considerations
### 7.4. Advanced Topics and Future Directions
    `;

    const nodes = [];
    const links = [];
    const nodeMap = new Map(); // To easily find nodes by ID
    let currentModuleId = null;
    let currentModuleGroup = -1; // Track group for coloring

    // --- First Pass: Create all nodes ---
    modulesData.split('\n').forEach(line => {
        line = line.trim();
        if (line.startsWith('## Module')) {
            const parts = line.match(/## Module (\d+): (.*)/);
            if (parts) {
                currentModuleId = `M${parts[1]}`;
                currentModuleGroup = parseInt(parts[1], 10);
                const node = {
                    id: currentModuleId,
                    name: `M${parts[1]}`,
                    title: line.substring(3),
                    type: 'module',
                    group: currentModuleGroup
                 };
                nodes.push(node);
                nodeMap.set(node.id, node);
            }
        } else if (line.startsWith('###')) {
            const parts = line.match(/### (\d+\.\d+)\. (.*)/);
             if (parts && currentModuleId) {
                const subModuleId = `S${parts[1]}`;
                 const node = {
                    id: subModuleId,
                    name: parts[1],
                    title: line.substring(4),
                    type: 'submodule',
                    group: currentModuleGroup // Inherit group from parent module
                 };
                nodes.push(node);
                nodeMap.set(node.id, node);
                // Link submodule to its parent module immediately
                links.push({ source: currentModuleId, target: subModuleId, type: 'submodule' });
            }
        }
    });

    // --- Second Pass: Add specific prerequisite links ---
    const prerequisites = [
        // M0 is foundational -> links to starting modules
        { source: 'M0', target: 'M1', type: 'prereq' },
        { source: 'M0', target: 'M2', type: 'prereq' },
        { source: 'M0', target: 'M3', type: 'prereq' },

        // Dependencies based on user rules
        { source: 'M1', target: 'M4', type: 'prereq' },
        { source: 'M2', target: 'M4', type: 'prereq' },
        { source: 'M2', target: 'M5', type: 'prereq' },
        { source: 'M3', target: 'M6', type: 'prereq' },

        // Integration module dependencies
        { source: 'M4', target: 'M7', type: 'prereq' },
        { source: 'M5', target: 'M7', type: 'prereq' },
        { source: 'M6', target: 'M7', type: 'prereq' },
    ];

    prerequisites.forEach(link => {
        // Ensure both source and target nodes exist before adding the link
        if (nodeMap.has(link.source) && nodeMap.has(link.target)) {
            links.push(link);
        } else {
            console.warn(`Skipping link: ${link.source} -> ${link.target}. One or both nodes not found.`);
        }
    });


    // 2. SVG Setup
    const svg = d3.select("svg");
    const width = +svg.attr("width");
    const height = +svg.attr("height");
    const tooltip = d3.select(".tooltip");

    // 3. Color Scale
    const color = d3.scaleOrdinal(d3.schemeCategory10);

    // 4. Force Simulation
    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id)
               .distance(link => {
                    // Different distances based on link type
                    const targetNode = nodeMap.get(link.target.id); // Get target node details
                    if (targetNode.type === 'submodule') return 45; // Tight cluster for submodules
                    if (link.type === 'prereq') return 120; // Longer distance for prerequisites
                    return 80; // Default distance
               })
               .strength(0.8) // Slightly stronger links
        )
        .force("charge", d3.forceManyBody().strength(-200)) // Increased repulsion
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collide", d3.forceCollide().radius(d => (d.type === 'module' ? 25 : 10) + 5)); // Collision detection, bit more padding


    // 5. Draw Links
    const link = svg.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", d => `link ${d.type}`) // Add type class (prereq or submodule)
        // Add arrowheads based on type
        .attr("marker-end", d => d.type === 'prereq' ? "url(#prereq-arrow)" : "url(#arrow)");


    // 6. Draw Nodes (Groups containing Circle + Text)
    const node = svg.append("g")
        .attr("class", "nodes")
        .selectAll("g.node")
        .data(nodes)
        .enter().append("g")
         // Add class for Module 0 styling
        .attr("class", d => `node ${d.id === 'M0' ? 'module-0' : ''}`)
        .call(drag(simulation)) // Add drag behavior
        .on("mouseover", (event, d) => {
            tooltip.transition().duration(200).style("opacity", .9);
            tooltip.html(`<b>${d.name}</b><br>${d.title}`) // Show ID and full title
                   .style("left", (event.pageX + 10) + "px")
                   .style("top", (event.pageY - 28) + "px");
            // Optional: Highlight neighbours on hover
            // link.style('stroke-opacity', l => (l.source === d || l.target === d) ? 1 : 0.1);
            // link.style('stroke-width', l => (l.source === d || l.target === d) ? 2.5 : 1.5);
            // node.style('opacity', n => (links.some(l => (l.source === d && l.target === n) || (l.target === d && l.source === n)) || n === d) ? 1 : 0.3);

        })
        .on("mouseout", (event, d) => {
            tooltip.transition().duration(500).style("opacity", 0);
            // Optional: Reset highlight
            // link.style('stroke-opacity', 0.6);
            // link.style('stroke-width', l => l.type === 'prereq' ? 2 : 1.5);
            // node.style('opacity', 1);
        });

    // Add circles to nodes
    node.append("circle")
        .attr("r", d => d.type === 'module' ? 20 : 8) // Larger radius for main modules
        .attr("fill", d => d.id === 'M0' ? '#f0e442' : color(d.group)); // M0 yellow, others by scheme

    // Add text labels to nodes
    node.append("text")
        .text(d => d.name)
        .attr("dy", d => d.type === 'module' ? 4 : 3) // Slight vertical offset
        .attr("class", d => d.type === 'module' ? 'module-text' : '');

    // 7. Simulation Tick Function
    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("transform", d => `translate(${d.x},${d.y})`);
    });

    // 8. Drag Functions (unchanged)
    function drag(simulation) {
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            // Optional: Release fixed position only if node is not M0
            // if (d.id !== 'M0') {
                 d.fx = null;
                 d.fy = null;
            // }
        }

        return d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended);
    }

</script>

</body>
</html>
