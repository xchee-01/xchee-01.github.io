<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADD Knowledge Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        .web-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1800px;
            height: 1800px;
        }
        
        .node {
            position: absolute;
            background-color: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
            font-size: 12px;
            text-align: center;
            width: 120px;
            overflow: hidden;
            cursor: pointer;
            z-index: 10;
        }
        
        .node:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
            transform: translate(-50%, -50%) scale(1.2);
        }
        
        .core {
            background-color: #FFC107;
            font-weight: bold;
        }
        
        .module0 { background-color: #FFECB3; }
        .module1 { background-color: #C5E1A5; }
        .module2 { background-color: #80DEEA; }
        .module3 { background-color: #9FA8DA; }
        .module4 { background-color: #CE93D8; }
        .module5 { background-color: #F48FB1; }
        .module6 { background-color: #FFAB91; }
        .module7 { background-color: #B0BEC5; }
        
        .connection {
            position: absolute;
            height: 1px;
            background-color: rgba(0,0,0,0.1);
            transform-origin: 0 0;
            z-index: 1;
        }
        
        .level-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px dashed rgba(0,0,0,0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        
        .level-label {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 10px;
        }
        
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        
        #zoom-in, #zoom-out, #reset {
            margin: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        
        #legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="web-container" id="web">
            <!-- Circles will be added by JavaScript -->
        </div>
    </div>
    
    <div id="controls">
        <button id="zoom-in">Zoom In</button>
        <button id="zoom-out">Zoom Out</button>
        <button id="reset">Reset</button>
    </div>
    
    <div id="legend">
        <h3>Module Legend</h3>
        <div class="legend-item"><div class="legend-color core"></div>Core Concepts</div>
        <div class="legend-item"><div class="legend-color module0"></div>Module 0: Foundations</div>
        <div class="legend-item"><div class="legend-color module1"></div>Module 1: Ligand-Based VS</div>
        <div class="legend-item"><div class="legend-color module2"></div>Module 2: Structure-Based VS</div>
        <div class="legend-item"><div class="legend-color module3"></div>Module 3: QSAR</div>
        <div class="legend-item"><div class="legend-color module4"></div>Module 4: ML-Based VS</div>
        <div class="legend-item"><div class="legend-color module5"></div>Module 5: MD Simulation</div>
        <div class="legend-item"><div class="legend-color module6"></div>Module 6: ADME/Tox</div>
        <div class="legend-item"><div class="legend-color module7"></div>Module 7: Integration</div>
    </div>
    
    <script>
        // Core concept at the center
        const coreNode = { 
            id: 'core', 
            title: 'Drug Discovery & CADD', 
            level: 0, 
            angle: 0, 
            class: 'core'
        };
        
        // Define all the nodes with their levels
        const nodes = [
            coreNode,
            // Module 0 (Level 1)
            { id: '0.1', title: 'Drug Discovery Context', level: 1, angle: 0, class: 'module0', connections: ['core'] },
            { id: '0.2', title: 'Basic Chemistry', level: 1, angle: 45, class: 'module0', connections: ['core'] },
            { id: '0.3', title: 'Targets & Ligands', level: 1, angle: 90, class: 'module0', connections: ['core'] },
            { id: '0.4', title: 'Molecular Interactions', level: 1, angle: 135, class: 'module0', connections: ['core', '0.2', '0.3'] },
            { id: '0.5', title: 'Protein-Ligand Binding', level: 1, angle: 180, class: 'module0', connections: ['core', '0.3', '0.4'] },
            { id: '0.6', title: 'Computational Representation', level: 1, angle: 225, class: 'module0', connections: ['core', '0.7'] },
            { id: '0.7', title: 'Computing Fundamentals', level: 1, angle: 270, class: 'module0', connections: ['core'] },
            
            // Module 1 (Level 2)
            { id: '1.1', title: 'LBVS Fundamentals', level: 2, angle: 0, class: 'module1', connections: ['0.1', '0.3', '0.6'] },
            { id: '1.2', title: 'Molecular Descriptors', level: 2, angle: 30, class: 'module1', connections: ['0.2', '0.6'] },
            { id: '1.3', title: 'Molecular Fingerprints', level: 2, angle: 60, class: 'module1', connections: ['1.2'] },
            { id: '1.4', title: 'Pharmacophore-Based Screening', level: 2, angle: 90, class: 'module1', connections: ['0.4', '1.1'] },
            { id: '1.5', title: 'Shape-Based Screening', level: 2, angle: 120, class: 'module1', connections: ['1.4'] },
            { id: '1.6', title: 'LBVS Applications', level: 2, angle: 150, class: 'module1', connections: ['1.1', '1.3', '1.4', '1.5'] },
            
            // Module 2 (Level 2-3)
            { id: '2.1', title: 'Structural Biology Foundations', level: 2, angle: 180, class: 'module2', connections: ['0.3', '0.5'] },
            { id: '2.2', title: 'Interaction Analysis', level: 2, angle: 210, class: 'module2', connections: ['0.4', '0.5', '2.1'] },
            { id: '2.3', title: 'Docking Preparation', level: 2, angle: 240, class: 'module2', connections: ['0.6', '2.1'] },
            { id: '2.4', title: 'Docking Algorithms', level: 3, angle: 200, class: 'module2', connections: ['0.7', '2.3'] },
            { id: '2.5', title: 'Scoring Functions', level: 3, angle: 230, class: 'module2', connections: ['0.4', '2.2', '2.4'] },
            { id: '2.6', title: 'SBVS Implementation', level: 3, angle: 260, class: 'module2', connections: ['2.3', '2.4', '2.5'] },
            
            // Module 3 (Level 3)
            { id: '3.1', title: 'QSAR Fundamentals', level: 3, angle: 0, class: 'module3', connections: ['1.1', '1.2'] },
            { id: '3.2', title: 'Medicinal Chemistry for QSAR', level: 3, angle: 30, class: 'module3', connections: ['0.2', '3.1'] },
            { id: '3.3', title: 'QSAR Descriptors', level: 3, angle: 60, class: 'module3', connections: ['1.2', '3.1'] },
            { id: '3.4', title: 'QSAR Modeling', level: 3, angle: 90, class: 'module3', connections: ['3.1', '3.3'] },
            { id: '3.5', title: 'Model Validation', level: 3, angle: 120, class: 'module3', connections: ['3.4'] },
            { id: '3.6', title: 'QSAR Applications', level: 3, angle: 150, class: 'module3', connections: ['3.4', '3.5'] },
            
            // Module 4 (Level 4)
            { id: '4.1', title: 'ML Foundations', level: 4, angle: 20, class: 'module4', connections: ['0.7', '3.1'] },
            { id: '4.2', title: 'ML Feature Representation', level: 4, angle: 60, class: 'module4', connections: ['1.2', '3.3', '4.1'] },
            { id: '4.3', title: 'ML Algorithms', level: 4, angle: 100, class: 'module4', connections: ['4.1', '4.2'] },
            { id: '4.4', title: 'Advanced ML Methods', level: 4, angle: 140, class: 'module4', connections: ['4.3'] },
            { id: '4.5', title: 'ML Implementation', level: 4, angle: 180, class: 'module4', connections: ['4.1', '4.3', '4.4'] },
            
            // Module 5 (Level 4-5)
            { id: '5.1', title: 'Physical Chemistry for MD', level: 4, angle: 230, class: 'module5', connections: ['0.2', '0.4'] },
            { id: '5.2', title: 'MD Fundamentals', level: 4, angle: 270, class: 'module5', connections: ['5.1'] },
            { id: '5.3', title: 'Solvation Models', level: 4, angle: 310, class: 'module5', connections: ['0.4', '5.2'] },
            { id: '5.4', title: 'MD System Setup', level: 4, angle: 350, class: 'module5', connections: ['2.3', '5.2', '5.3'] },
            { id: '5.5', title: 'Production MD', level: 5, angle: 240, class: 'module5', connections: ['5.2', '5.4'] },
            { id: '5.6', title: 'Enhanced Sampling', level: 5, angle: 270, class: 'module5', connections: ['5.5'] },
            { id: '5.7', title: 'MD Analysis', level: 5, angle: 300, class: 'module5', connections: ['5.5'] },
            { id: '5.8', title: 'MD Applications', level: 5, angle: 330, class: 'module5', connections: ['5.5', '5.6', '5.7'] },
            
            // Module 6 (Level 5)
            { id: '6.1', title: 'ADME Fundamentals', level: 5, angle: 30, class: 'module6', connections: ['0.2', '3.2'] },
            { id: '6.2', title: 'Chemical Basis of ADME', level: 5, angle: 80, class: 'module6', connections: ['6.1'] },
            { id: '6.3', title: 'Toxicity Prediction', level: 5, angle: 130, class: 'module6', connections: ['6.1', '4.5'] },
            { id: '6.4', title: 'Drug Optimization', level: 5, angle: 180, class: 'module6', connections: ['3.6', '6.1', '6.2', '6.3'] },
            
            // Module 7 (Level 6)
            { id: '7.1', title: 'Integrated Approaches', level: 6, angle: 0, class: 'module7', connections: ['1.6', '2.6', '3.6', '4.5', '5.8', '6.4'] },
            { id: '7.2', title: 'Case Studies', level: 6, angle: 90, class: 'module7', connections: ['7.1'] },
            { id: '7.3', title: 'Practical Considerations', level: 6, angle: 180, class: 'module7', connections: ['7.1'] },
            { id: '7.4', title: 'Advanced Topics', level: 6, angle: 270, class: 'module7', connections: ['7.1', '7.2', '7.3'] }
        ];

        // Define the radii for each level
        const levelRadius = [0, 140, 280, 420, 560, 700, 840];
        
        // Create the nodes in the web
        const webContainer = document.getElementById('web');
        
        // Add level indicators (circles)
        for (let i = 0; i < levelRadius.length; i++) {
            const circle = document.createElement('div');
            circle.className = 'level-indicator';
            circle.style.width = (levelRadius[i] * 2) + 'px';
            circle.style.height = (levelRadius[i] * 2) + 'px';
            
            if (i > 0) {
                const label = document.createElement('div');
                label.className = 'level-label';
                label.textContent = `Level ${i}`;
                circle.appendChild(label);
            }
            
            webContainer.appendChild(circle);
        }
        
        // Create node elements
        nodes.forEach(node => {
            const nodeEl = document.createElement('div');
            nodeEl.className = `node ${node.class}`;
            nodeEl.id = node.id;
            nodeEl.textContent = node.title;
            
            // Position based on level and angle
            const radius = levelRadius[node.level];
            const radian = (node.angle * Math.PI) / 180;
            const x = Math.cos(radian) * radius + 900; // Center is at 900px
            const y = Math.sin(radian) * radius + 900; // Center is at 900px
            
            nodeEl.style.left = x + 'px';
            nodeEl.style.top = y + 'px';
            
            webContainer.appendChild(nodeEl);
        });
        
        // Create connections
        nodes.forEach(node => {
            if (!node.connections) return;
            
            node.connections.forEach(targetId => {
                const targetNode = nodes.find(n => n.id === targetId);
                if (!targetNode) return;
                
                // Get positions of both nodes
                const sourceRadius = levelRadius[node.level];
                const sourceRadian = (node.angle * Math.PI) / 180;
                const sourceX = Math.cos(sourceRadian) * sourceRadius + 900;
                const sourceY = Math.sin(sourceRadian) * sourceRadius + 900;
                
                const targetRadius = levelRadius[targetNode.level];
                const targetRadian = (targetNode.angle * Math.PI) / 180;
                const targetX = Math.cos(targetRadian) * targetRadius + 900;
                const targetY = Math.sin(targetRadian) * targetRadius + 900;
                
                // Create line element
                const line = document.createElement('div');
                line.className = 'connection';
                
                // Calculate length and angle of line
                const dx = targetX - sourceX;
                const dy = targetY - sourceY;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                
                // Set line properties
                line.style.width = length + 'px';
                line.style.left = sourceX + 'px';
                line.style.top = sourceY + 'px';
                line.style.transform = `rotate(${angle}deg)`;
                
                webContainer.appendChild(line);
            });
        });
        
        // Zoom functionality
        let scale = 1;
        const container = document.getElementById('container');
        const web = document.getElementById('web');
        
        document.getElementById('zoom-in').addEventListener('click', () => {
            scale *= 1.2;
            web.style.transform = `scale(${scale})`;
        });
        
        document.getElementById('zoom-out').addEventListener('click', () => {
            scale /= 1.2;
            web.style.transform = `scale(${scale})`;
        });
        
        document.getElementById('reset').addEventListener('click', () => {
            scale = 1;
            web.style.transform = `scale(${scale})`;
        });
        
        // Node hover effect - highlight connections
        document.querySelectorAll('.node').forEach(node => {
            node.addEventListener('mouseover', () => {
                const nodeId = node.id;
                const nodeData = nodes.find(n => n.id === nodeId);
                
                // Highlight connections from this node
                if (nodeData && nodeData.connections) {
                    nodeData.connections.forEach(targetId => {
                        const targetNode = document.getElementById(targetId);
                        if (targetNode) {
                            targetNode.style.boxShadow = '0 0 10px 5px rgba(255,152,0,0.7)';
                        }
                    });
                }
                
                // Highlight connections to this node
                nodes.forEach(n => {
                    if (n.connections && n.connections.includes(nodeId)) {
                        const sourceNode = document.getElementById(n.id);
                        if (sourceNode) {
                            sourceNode.style.boxShadow = '0 0 10px 5px rgba(255,152,0,0.7)';
                        }
                    }
                });
            });
            
            node.addEventListener('mouseout', () => {
                document.querySelectorAll('.node').forEach(n => {
                    n.style.boxShadow = '0 2px 5px rgba(0,0,0,0.2)';
                });
            });
        });
    </script>
</body>
</html>
