<!DOCTYPE html>
<html>
  <head>
    <!-- Loading datatables, a JS library from the CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.css">
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.js"></script>
    
    <script>
      // The line below invokes the getData() function in the Code.gs file
      google.script.run.withSuccessHandler(showData).getData();
    
      function showData(dataArray) {
        console.log(dataArray); // For debugging
        if(!dataArray || dataArray.length === 0) {
          document.getElementById('error-message').textContent = 'No data returned from spreadsheet';
          return;
        }
        
        $(document).ready(function() {
          $('#table-data').DataTable({
            data: dataArray,
            columns: [
              {"title":"First Name"},
              {"title":"Last Name"}
            ]
          });
        });
      }      
    </script>
  </head>
 
  <body>
    <div id="error-message" style="color: red;"></div>
    <div>
      <table id="table-data">
        <!-- Data will be injected here -->
      </table>
    </div>
  </body>
</html>
