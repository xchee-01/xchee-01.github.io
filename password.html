<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            color: #f44336;
        }
        .protected-content {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="login-form">
        <h2>Login</h2>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required>
        </div>
        <button class="btn" onclick="authenticate()">Login</button>
        <div id="message"></div>
    </div>

    <div class="container protected-content" id="protected-content">
        <h2>Welcome!</h2>
        <p>You have successfully logged in. This is your protected content.</p>
        <button class="btn" onclick="logout()">Logout</button>
    </div>

    <script>
        // This script uses the Google Apps Script Web App as a backend
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqKUAlCr4GyG0rnThU1cKDdXvCtX1r7MQKvhZdfK8wgYA7dwinY_NtAsRUsLC15Drd/exec';

        function authenticate() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!email || !password) {
                messageDiv.innerText = "Please enter both email and password.";
                return;
            }
            
            messageDiv.innerText = "Authenticating...";
            
            // Log the data being sent (for debugging)
            console.log("Attempting login with:", email, password);
            
            // Send the login request to your Google Apps Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'login',
                    email: email,
                    password: password
                })
            })
            .then(response => {
                console.log("Response status:", response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log("Response data:", data);
                if (data.success) {
                    // Login successful
                    document.getElementById('login-form').style.display = 'none';
                    document.getElementById('protected-content').style.display = 'block';
                    // You could also store a token in session storage if needed
                    sessionStorage.setItem('authenticated', 'true');
                } else {
                    // Login failed
                    messageDiv.innerText = data.message || "Invalid email or password.";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageDiv.innerText = "An error occurred. Please try again. (Error: " + error.message + ")";
            });
        }
        
        function logout() {
            sessionStorage.removeItem('authenticated');
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('protected-content').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('message').innerText = '';
        }
        
        // Check if user is already authenticated (e.g., if they refresh the page)
        window.onload = function() {
            if (sessionStorage.getItem('authenticated') === 'true') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
            }
        };
    </script>
</body>
</html>
