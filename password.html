<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            color: #f44336;
        }
        .protected-content {
            display: none;
        }
        iframe {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="login-form">
        <h2>Login</h2>
        <form id="auth-form" target="hidden-iframe" method="POST">
            <input type="hidden" name="action" value="login">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <div id="message"></div>
        </form>
    </div>

    <div class="container protected-content" id="protected-content">
        <h2>Welcome!</h2>
        <p>You have successfully logged in. This is your protected content.</p>
        <button class="btn" onclick="logout()">Logout</button>
    </div>

    <!-- Hidden iframe to receive the response -->
    <iframe name="hidden-iframe" id="hidden-iframe"></iframe>

    <script>
        // Replace with your actual Google Apps Script Web App URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyb6nyoNuEW5ArgkS3V_fdJbINjTfw6jmBxerqj68uuLNg6X-oIT-K1kFa9QagredxU/exec';
        
        // Set the form action to the script URL
        document.getElementById('auth-form').action = SCRIPT_URL;
        
        // Handle form submission
        document.getElementById('auth-form').addEventListener('submit', function(event) {
            // Don't actually prevent default - we want the form to submit to the iframe
            document.getElementById('message').innerText = "Authenticating...";
        });
        
        // Listen for messages from the iframe
        window.addEventListener('message', function(event) {
            // Ensure the message is from our Google Apps Script
            if (event.origin.includes('script.google.com')) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.success) {
                        // Login successful
                        document.getElementById('login-form').style.display = 'none';
                        document.getElementById('protected-content').style.display = 'block';
                        sessionStorage.setItem('authenticated', 'true');
                    } else {
                        // Login failed
                        document.getElementById('message').innerText = data.message || "Invalid email or password.";
                    }
                } catch (error) {
                    console.error('Error parsing response:', error);
                    document.getElementById('message').innerText = "An error occurred. Please try again.";
                }
            }
        });
        
        function logout() {
            sessionStorage.removeItem('authenticated');
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('protected-content').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('message').innerText = '';
        }
        
        // Check if user is already authenticated
        window.onload = function() {
            if (sessionStorage.getItem('authenticated') === 'true') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
            }
        };
    </script>
</body>
</html>
