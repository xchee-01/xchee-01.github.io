<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration and Login</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .switch-form {
            text-align: center;
            margin-top: 20px;
        }
        .switch-form a {
            color: #4CAF50;
            text-decoration: none;
        }
        .switch-form a:hover {
            text-decoration: underline;
        }
        .message {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }
        .error {
            color: #ff0000;
        }
        .success {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Registration Form -->
        <div id="registration-form">
            <h2>Create an Account</h2>
            <div class="form-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" required>
            </div>
            <div class="form-group">
                <label for="reg-confirm-password">Confirm Password</label>
                <input type="password" id="reg-confirm-password" required>
            </div>
            <button id="register-btn">Register</button>
            <div class="switch-form">
                <p>Already have an account? <a href="#" id="show-login">Login here</a></p>
            </div>
            <div id="reg-message" class="message"></div>
        </div>

        <!-- Login Form -->
        <div id="login-form" style="display: none;">
            <h2>Login to Your Account</h2>
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button id="login-btn">Login</button>
            <div class="switch-form">
                <p>Don't have an account? <a href="#" id="show-register">Register here</a></p>
            </div>
            <div id="login-message" class="message"></div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Switch between registration and login forms
            $("#show-login").click(function() {
                $("#registration-form").hide();
                $("#login-form").show();
            });

            $("#show-register").click(function() {
                $("#login-form").hide();
                $("#registration-form").show();
            });

            // Store users in localStorage for this simple example
            // In a real application, you'd use a server-side database
            if (!localStorage.getItem('users')) {
                localStorage.setItem('users', JSON.stringify([]));
            }

            // Handle registration
            $("#register-btn").click(function() {
                const username = $("#reg-username").val().trim();
                const email = $("#reg-email").val().trim();
                const password = $("#reg-password").val();
                const confirmPassword = $("#reg-confirm-password").val();
                
                // Basic validation
                if (!username || !email || !password || !confirmPassword) {
                    $("#reg-message").html("Please fill in all fields").addClass("error");
                    return;
                }
                
                if (password !== confirmPassword) {
                    $("#reg-message").html("Passwords do not match").addClass("error");
                    return;
                }

                // Check if username already exists
                const users = JSON.parse(localStorage.getItem('users'));
                if (users.some(user => user.username === username)) {
                    $("#reg-message").html("Username already exists").addClass("error");
                    return;
                }

                // Hash password before storing (basic security measure)
                const hashedPassword = CryptoJS.SHA256(password).toString();
                
                // Add user to localStorage
                users.push({
                    username: username,
                    email: email,
                    password: hashedPassword,
                    registrationDate: new Date().toISOString()
                });
                localStorage.setItem('users', JSON.stringify(users));

                // Send data to Google Sheet using Google Form
                const googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSdf1-qVV2uV4n-qlJj8ZTGfGm9cXNS9bKTfzjG95HNERE3dGQ/viewform?usp=dialog'; // You'll need to replace this
                
                // Create form data
                const formData = new FormData();
                
                // Add your Google Form field entries - replace field IDs with your actual form field IDs
                formData.append('entry.1750667580', username); // Username field
                formData.append('entry.940165703', email); // Email field
                formData.append('entry.164732815', new Date().toISOString()); // Registration date field
                
                // Use fetch to submit the form data
                fetch(googleFormUrl, {
                    method: 'POST',
                    mode: 'no-cors', // Important! Google Forms requires no-cors mode
                    body: formData
                })
                .then(() => {
                    $("#reg-message").html("Registration successful! You can now login.").removeClass("error").addClass("success");
                    // Clear the form
                    $("#reg-username, #reg-email, #reg-password, #reg-confirm-password").val("");
                    // Switch to login form after a short delay
                    setTimeout(function() {
                        $("#show-login").click();
                    }, 2000);
                })
                .catch(error => {
                    console.error('Error submitting form:', error);
                    // We still show success because data is saved in localStorage
                    $("#reg-message").html("Registration successful! You can now login.").removeClass("error").addClass("success");
                    // Clear the form
                    $("#reg-username, #reg-email, #reg-password, #reg-confirm-password").val("");
                    // Switch to login form after a short delay
                    setTimeout(function() {
                        $("#show-login").click();
                    }, 2000);
                });
            });

            // Handle login
            $("#login-btn").click(function() {
                const username = $("#login-username").val().trim();
                const password = $("#login-password").val();
                
                // Basic validation
                if (!username || !password) {
                    $("#login-message").html("Please enter both username and password").addClass("error");
                    return;
                }

                // Check if credentials match
                const users = JSON.parse(localStorage.getItem('users'));
                const user = users.find(user => user.username === username);
                
                if (user && user.password === CryptoJS.SHA256(password).toString()) {
                    // Log the login to Google Sheet (optional)
                    const googleFormLoginUrl = 'YOUR_GOOGLE_FORM_LOGIN_URL'; // Optional - create a separate form for logins
                    
                    if (googleFormLoginUrl) {
                        const formData = new FormData();
                        formData.append('entry.123456789', username); // Username field
                        formData.append('entry.112233445', new Date().toISOString()); // Login date field
                        
                        fetch(googleFormLoginUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: formData
                        }).catch(error => console.error('Error logging login:', error));
                    }
                    
                    // Login successful
                    $("#login-message").html("Login successful! Redirecting...").removeClass("error").addClass("success");
                    // Redirect to the success page
                    setTimeout(function() {
                        window.location.href = "https://xchee-01.github.io/index.html";
                    }, 1500);
                } else {
                    // Login failed
                    $("#login-message").html("Invalid username or password").removeClass("success").addClass("error");
                }
            });
        });
    </script>
</body>
</html>
