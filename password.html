<!DOCTYPE html>
<html>
<head>
  <title>Google Sheets Data</title>
  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.css">
  <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.js"></script>
  
  <script>
    // Replace with your actual deployed Apps Script Web App URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbwQZdA1ckuIjJEh62gLV53n9KhNhoCATC2u-KcPlDK77dwAA8lxsOrQfbDq7xhhFyeBEw/exec';
    
    document.addEventListener('DOMContentLoaded', function() {
      // Fetch data from the API
      fetch(API_URL)
        .then(response => response.json())
        .then(result => {
          if (result.status === "success") {
            displayData(result.data);
          } else {
            document.getElementById('error-message').textContent = 'Error: ' + result.message;
          }
        })
        .catch(error => {
          document.getElementById('error-message').textContent = 'Error fetching data: ' + error;
        });
    });
    
    function displayData(dataArray) {
      console.log(dataArray); // For debugging
      if(!dataArray || dataArray.length === 0) {
        document.getElementById('error-message').textContent = 'No data returned from spreadsheet';
        return;
      }
      
      $('#table-data').DataTable({
        data: dataArray,
        columns: [
          {"title":"First Name"},
          {"title":"Last Name"}
        ]
      });
    }
  </script>
</head>
<body>
  <h1>Google Sheets Data</h1>
  <div id="error-message" style="color: red;"></div>
  <div>
    <table id="table-data">
      <!-- Data will be injected here -->
    </table>
  </div>
</body>
</html>
